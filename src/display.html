            mediaLayer.style.transition = 'none';
            mediaLayer.style.opacity = '0';
            mediaLayer.style.transform = animType === 'slide-up' ? 'translateY(16px)' : 'none';
            mediaLayer.offsetHeight;
            mediaLayer.style.transition = ease;
            mediaLayer.style.opacity = '1';
            mediaLayer.style.transform = 'none';
        };
        if (mediaLayer.hasChildNodes()) {
            mediaLayer.style.transition = ease;
            mediaLayer.style.opacity = '0';
            mediaLayer.style.transform = animType === 'slide-up' ? 'translateY(-16px)' : 'none';
            setTimeout(() => {
                if (gen !== mediaGen) return;   // a newer send or clear took over
                renderMediaStage(src, kind, fit, motion);
                if (src) comeIn(); else reset();
            }, ms + 20);
        } else {
            renderMediaStage(src, kind, fit, motion);
            if (src) comeIn(); else reset();
        }
    }

    function renderMediaStage(src, kind, fit, motion) {
        // Media goes out on the full theme only — and a text-only or stage
        // screen must not play a video's sound alongside the main screen.
        // Kept, to put back if this output goes back to its theme.
        lastMediaArgs = src ? [src, kind, fit, motion] : null;
        if (src && outputMode !== 'theme') { mediaLayer.innerHTML = ''; return; }
        mediaLayer.innerHTML = '';
        // The operator's transport bar (mute/play/seek/volume) only makes
        // sense while an actual <video> is showing — it used to just stay
        // visible-but-dead once the media layer's content changed to a
        // plain image or was cleared entirely (a scene switch overwriting
        // this SAME shared slot — see renderTimerScene — is exactly how
        // that happens now), since nothing ever told it to hide again: an
        // <img> never fires the play/pause/timeupdate events the transport
        // bar listens for, so the seek bar just sat frozen at 0:00/0:00
        // looking broken instead of disappearing. One explicit "here's what
        // the layer holds now" message covers every path (clear, image, or
        // video) instead of only the video side ever speaking up.
        if (!src) { sendToServer({ type: 'media-status', kind: 'none' }); return; }
        // object-fit accepts the literal 'fill' keyword natively (unlike
        // background-size, which needs the 100%/100% translation elsewhere
        // in this file) — inline style here wins over the CSS default
        // (object-fit:contain, see #media-layer img/video above), so a
        // sender that never passes fit keeps today's exact behavior.
        const objectFit = fit || 'contain';
        if (kind === 'video') {
            const v = document.createElement('video');
            v.src = authedMediaUrl(src);
            v.autoplay = true;
            v.loop = true;
            // Every modern engine (Chrome, and WebKit — what Tauri actually
            // renders through on macOS) silently refuses to autoplay an
            // UNMUTED video with no prior user gesture on the page, which a
            // passive output window never gets. There's no error, no event —
            // the element just never starts, which is exactly "the video
            // doesn't play" with nothing in the console to explain why.
            // Always start muted so autoplay is guaranteed to actually
            // happen, then un-mute right after playback begins if that's
            // the desired state — browsers only gate the INITIAL autoplay
            // request, not a later programmatic unmute of a video that's
            // already playing.
            v.muted = true;
            v.volume = mediaVolume;
            v.playsInline = true;
            v.style.objectFit = objectFit;
            if (motion === 'kenburns') v.style.animation = 'kairo-kenburns 18s ease-in-out infinite alternate';
            if (!MONITOR && mediaSinkId && typeof v.setSinkId === 'function') {
                v.setSinkId(mediaSinkId).catch(() => {});
            }
            // Sound plays from the operator window (app.js's renderMediaPreview), through the
            // device chosen under Settings → Outputs → Audio Output; a screen shows the picture only.
            // Throttled status reports so the operator's window can drive a
            // real seek slider without polling — see the server's WebSocket handler (kairo-server ws.rs).
            let lastReport = 0;
            v.addEventListener('timeupdate', () => {
                const now = Date.now();
                if (now - lastReport < 250) return;
                lastReport = now;
                reportMediaStatus(v);
            });
            v.addEventListener('play', () => reportMediaStatus(v));
            v.addEventListener('pause', () => reportMediaStatus(v));
            v.addEventListener('loadedmetadata', () => reportMediaStatus(v));
            // A file that won't load or decode shows black here: the operator is told.
            v.addEventListener('error', () => reportMediaError('video', v.error ? (['', 'stopped', 'a network error', 'it couldn’t be decoded', 'this format isn’t supported'][v.error.code] || v.error.message) : ''));
            mediaLayer.appendChild(v);
            // Belt-and-suspenders explicit play() alongside the declarative
            // `autoplay` attribute, called after the element is actually in
            // the document — caught, not awaited, so a rejection (e.g. the
            // source failing to decode) can't throw out of this function.
            v.play().catch((err) => console.warn('[Display] Video play() rejected:', err.message));
        } else {
            const img = document.createElement('img');
            img.addEventListener('error', () => reportMediaError('image', 'it couldn’t be loaded'));
            img.src = src;
            img.style.objectFit = objectFit;
            if (motion === 'kenburns') img.style.animation = 'kairo-kenburns 18s ease-in-out infinite alternate';
            mediaLayer.appendChild(img);
            sendToServer({ type: 'media-status', kind: 'image' });
        }
    }

    function reportMediaError(kind, why) {
        sendToServer({ type: 'media-status', kind: 'error', mediaKind: kind, error: why || '', output: OUTPUT_KEY });
    }
    function reportMediaStatus(v) {
        sendToServer({ type: 'media-status', kind: 'video', currentTime: v.currentTime, duration: v.duration || 0, paused: v.paused });
    }

    function applyMediaControl(action, value) {
        const v = currentMediaVideo();
        if (action === 'mute') { mediaMuted = true; if (v) v.muted = true; }
        else if (action === 'unmute') { mediaMuted = false; }
        else if (action === 'play') { if (v) v.play().catch(() => {}); }
        else if (action === 'pause') { if (v) v.pause(); }
        else if (action === 'seek') { if (v && typeof value === 'number') v.currentTime = value; }
        else if (action === 'volume') { mediaVolume = value; if (v) v.volume = value; }
    }

    async function applyAudioOutput(deviceId) {
        mediaSinkId = deviceId || null;
        const v = currentMediaVideo();
        if (v && mediaSinkId && typeof v.setSinkId === 'function') {
            try { await v.setSinkId(mediaSinkId); }
            catch (err) { console.warn('[KAIRO] setSinkId failed:', err.message); }
        }
    }

    // ── Update only the text content in existing layers (no re-render) ──────
    function updateTextContent(verseText, verseRef, translatedText = '', timerText = '') {
        // Same "no caption without a verse line" rule buildLayerDOM applies
        // at initial render — re-checked here so it still holds as verseText
        // changes slide-to-slide along this in-place (no-rebuild) path. Only
        // applies to themes that actually pair a caption with a verse layer;
        // a reference-only theme (no verse layer at all) always shows.
        const hasVerseLayer = (activeLook?.layers || []).some(l => l.type === 'text' && l.binding === 'verse' && l.visible !== false);
        const showCaptions = !hasVerseLayer || !!String(verseText || '').trim();
        // Use data-binding attributes to target the right divs
        stage.querySelectorAll('[data-binding="verse"]').forEach(el => {
            if (!window.KairoWordSplit?.applyMotionText(el, activeLook?.textAnimation, verseText, activeLook?.textAnimationSpeed || 1, { color: activeLook?.textHighlightColor, intensity: activeLook?.textAnimationIntensity })) {
                el.textContent = verseText;
            }
        });
        stage.querySelectorAll('[data-binding="verse_translated"]').forEach(el => {
            el.textContent = translatedText;
            el.style.display = showCaptions ? 'flex' : 'none';
        });
        stage.querySelectorAll('[data-binding="reference"]').forEach(el => {
            el.textContent = verseRef;
            el.style.display = showCaptions ? 'flex' : 'none';
        });
        // Only writes when a real value is passed — the per-second countdown
        // tick (handleActionBadge, below) writes into these same elements
        // far more often than any actual slide change does, and shouldn't
        // get blanked out by an ordinary verse update that has nothing to
        // do with the timer at all.
        if (timerText) {
            stage.querySelectorAll('[data-binding="timer"]').forEach(el => { el.textContent = timerText; });
        }
    }

    // ── Apply a new look (re-render with existing text) ────────────────────
    function applyLook(look, animate = true) {
        activeLook = look;
        renderStage(currentVerseText, currentVerseRef, animate, currentTranslatedText, currentStyleByLayerId, currentTimerText);
    }

    // ── Show verse (smart update: re-render on first verse, in-place after) ──
    // Does the theme on air bind slide text into an imported ProPresenter box?
    function lookHasPpText() {
        const layers = (activeLook || FALLBACK_LOOK).layers || [];
        return layers.some(l => l && l.type === 'pp' && l.visible !== false && l.binding && l.binding !== 'none');
    }

    function showVerse(text, ref, isRangeActive = false, translatedText = '', styleByLayerId = {}, timerText = '') {
        const wasEmpty = !currentVerseText && !currentVerseRef && !currentTimerText;
        // Also compare the style override — the exact same slide re-sent
        // after only tweaking its per-slide layout (Full Edit) must still
        // pick up the new override, not take the text-only in-place path
        // below (which never touches position/font).
        const styleChanged = JSON.stringify(styleByLayerId || {}) !== JSON.stringify(currentStyleByLayerId || {});
        const changed  = text !== currentVerseText || ref !== currentVerseRef || translatedText !== currentTranslatedText || styleChanged || timerText !== currentTimerText;
        currentVerseText = text;
        currentVerseRef  = ref;
        currentTranslatedText = translatedText;
        currentStyleByLayerId = styleByLayerId || {};
        currentTimerText = timerText;

        if (!changed) {
            if (isRangeActive) setRangeActive(true);
            return;
        }
        // Shares renderStage's own generation counter — a superseded call
        // here needs to invalidate a still-pending renderStage fade just as
        // much as renderStage invalidating one of its own (rapid successive
        // advances, e.g. the lyric follower, can call either path back to
        // back).
        const myGen = ++renderGen;

        if (wasEmpty || stage.children.length === 0) {
            // First verse or blank stage — do a full render with fade
            renderStage(text, ref, true, translatedText, currentStyleByLayerId, timerText);
        } else if (lookHasPpText()) {
            // An imported ProPresenter text box (pp_render.js) is its own
            // run-by-run layout, not a [data-binding] element the in-place
            // swap below could update — that swap left the previous slide's
            // words on screen. Rebuild instead (renderStage keeps the
            // transition).
            renderStage(text, ref, true, translatedText, currentStyleByLayerId, timerText);
        } else if (styleChanged) {
            // Text unchanged but the layout override changed — the in-place
            // path below only ever swaps textContent, so a style-only change
            // needs the full rebuild too.
            renderStage(text, ref, true, translatedText, currentStyleByLayerId, timerText);
        } else {
            // Stage already has layers — fade (+ slide, for 'slide-up') text,
            // swap, fade back in. This in-place path (not renderStage, which
            // rebuilds the whole layer stack) is what actually runs for
            // every ordinary slide-to-slide change once the stage is
            // already showing something — a plain hardcoded 250ms opacity
            // fade here used to silently ignore whatever transition
            // renderStage itself already respects, so a theme like Lyrics
            // — Motion never visibly animated in real use, only on the
            // very first slide of a service. Reads the same display-level
            // outputAnimation/outputAnimationSpeed renderStage uses now
            // (see that comment) rather than a per-theme field.
            const animType = outputAnimation;
            const speedMs = Math.round(300 * outputAnimationSpeed);

            // 'cut' skips this whole-block opacity/transform choreography
            // entirely. Text Animation (a separate per-theme setting from
            // this Transition) still runs inside updateTextContent either
            // way — Fade/Slide + a Text Animation is a valid combination.
            if (animType === 'cut') {
                updateTextContent(text, ref, translatedText, timerText);
                fitVerse();
                if (isRangeActive) setRangeActive(true);
                return;
            }

            const textEls = stage.querySelectorAll('[data-binding]');
            textEls.forEach(el => {
                el.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`;
                el.style.opacity    = '0';
                if (animType === 'slide-up') el.style.transform = 'translateY(-16px)';
            });

            setTimeout(() => {
                if (myGen !== renderGen) return; // superseded by a newer render — don't paint stale content
                updateTextContent(text, ref, translatedText, timerText);
                fitVerse();
                if (animType === 'slide-up') {
                    // Same forced-reflow trick as renderStage's own slide-up
                    // path — land at the "below" starting point with no
                    // transition first, so animating back to place actually
                    // plays instead of jumping straight there.
                    textEls.forEach(el => { el.style.transition = 'none'; el.style.transform = 'translateY(16px)'; });
                    stage.offsetHeight; // force layout
                    textEls.forEach(el => { el.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`; el.style.transform = 'none'; });
                }
                textEls.forEach(el => { el.style.opacity = ''; });
            }, speedMs + 10);
        }

        // Range active highlight
        if (isRangeActive) {
            setTimeout(() => setRangeActive(true), 320);
        }
    }

    // Genuinely empty — not renderStage('', '', true), which still paints
    // the theme's own background layer (opaque, by default) with just the
    // text missing. That's fine on its own, but it sits at a higher
    // z-index than the independent media layer, so an opaque "empty" slide
    // layer permanently hides any image/video sent there — clearing never
    // actually looked cleared once media was in the picture. Dropping the
    // slide layer's content entirely when there's nothing to show lets the
    // media layer show through, the same way a cleared front layer in
    // ProPresenter reveals whatever's behind it.
    function clearDisplay() {
        currentImageSlide = null;
        currentVerseText = '';
        currentVerseRef  = '';
        currentTranslatedText = '';
        currentStyleByLayerId = {};
        renderStage('', '', true); // renderStage itself leaves the layer empty for blank text
    }

    function setRangeActive(active) {
        // Target text layers specifically (they have data-binding)
        stage.querySelectorAll('[data-binding]').forEach(el => {
            el.style.filter = active ? 'brightness(1.18)' : '';
        });
    }

    // ── Storage event → look updated from main window ─────────────────────
    window.addEventListener('storage', (e) => {
        if (e.key === 'kairo-output-themes' && e.newValue) {
            try {
                const map = JSON.parse(e.newValue);
                if (map && map[OUTPUT_KEY]) { assignedLook = map[OUTPUT_KEY]; applyLook(frameBaseLook(), true); return; }
            } catch {}
        }
        if (e.key === 'kairo-active-look' && e.newValue) {
            try {
                assignedLook = JSON.parse(e.newValue);
                applyLook(frameBaseLook(), true);
            } catch {}
        }
        if (e.key === 'kairo-output-layers' && e.newValue) {
            try {
                const map = JSON.parse(e.newValue);
                if (map && map[OUTPUT_KEY]) applyOutputLayers({ ...DEFAULT_LAYERS, ...map[OUTPUT_KEY] });
            } catch {}
        }
        if (e.key === 'kairo-monitor-looks') {
            try { setMonitorLook((JSON.parse(e.newValue || '{}') || {})[OUTPUT_KEY] || null); } catch {}
        }
        if (e.key === 'kairo-output-frames' && !PREVIEW) {
            try { const map = JSON.parse(e.newValue || 'null'); setFrame(map && map[OUTPUT_KEY] || null); } catch {}
        }
        if (e.key === 'kairo-video-sources' || e.key === 'kairo-video-live') syncVideo();
        if (e.key === 'kairo-output-keying' && e.newValue) {
            try { applyOutputKeying((JSON.parse(e.newValue) || {})[OUTPUT_KEY]); } catch {}
        }
        if (e.key === 'kairo-output-modes' && e.newValue) {
            try { applyOutputMode((JSON.parse(e.newValue) || {})[OUTPUT_KEY]); } catch {}
        }
    });

    // The Video Input layer: a capture window (NDI, Syphon, DeckLink) never
    // opens a camera, and a monitor copy only does in the director's frames.
    syncVideo();
    if (outputMode === 'multiview') startMultiview();
    window.addEventListener('pagehide', () => { try { videoLayer && videoLayer.dispose(); } catch {} });
    // Video director mode's Preview: the parent stages a verse and a source here.
    if (PREVIEW) {
        window.addEventListener('message', (e) => {
            if (e.origin !== location.origin || !e.data || !e.data.kairoPreview) return;
            const m = e.data.msg || {};
            if (m.type === 'vd-source') { previewSourceId = m.sourceId || null; syncVideo(); return; }
            // A Look loaded into Preview: its layers apply here only (null goes back to this output's own).
            if (m.type === 'vd-layers') { previewVideoOn = !m.layers || m.layers.video !== false; applyOutputLayers(m.layers ? { ...DEFAULT_LAYERS, ...m.layers } : loadOutputLayers()); syncVideo(); return; }
            // A Look's screen theme loaded into Preview (null goes back to this output's own theme).
            if (m.type === 'vd-frame') { setFrame(m.look || null); return; }
            if (m.type === 'vd-theme') { assignedLook = m.look || loadActiveLook() || assignedLook; applyLook(assignedLook, false); return; }
            handleMessage(m);
        });
    }

    // Re-fit when the output window resizes (projector attach, fullscreen toggle).
    window.addEventListener('resize', () => { try { fitVerse(); fitConfidenceText(); } catch {} });

    // ── F key → fullscreen ─────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }
    });

    // ── WebSocket ──────────────────────────────────────────────────────────
    function connect() {
        if (ws) { try { ws.close(); } catch {} ws = null; }

        setConnStatus('reconnecting', 'Connecting…');

        try { ws = new WebSocket(authedWsUrl(WS_URL)); }
        catch { scheduleReconnect(); return; }

        ws.onopen = () => {
            clearTimeout(reconnectTimer);
            reconnectAttempts = 0;
            setConnStatus('connected', '');
            setTimeout(() => connStatus.classList.remove('visible'), 1500);
            window.KairoOverlays.load().then(items => { lastOverlays = items; drawOverlays(); });
        };

        ws.onmessage = (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch { return; }
            // One message that fails to draw is logged (by its type) and the next still lands,
            // instead of the error ending this handler's turn with no trace.
            try { handleMessage(msg); } catch (err) {
                console.error('[display] message failed:', msg && msg.type, err);
                try { window.dispatchEvent(new ErrorEvent('error', { message: `${msg && msg.type}: ${err && err.message}`, filename: 'display.html' })); } catch {}
            }
        };

        ws.onerror = () => {};

        ws.onclose = () => {
            ws = null;
            setConnStatus('reconnecting', 'Reconnecting…');
            connStatus.classList.add('visible');
            scheduleReconnect();
        };
    }

    function scheduleReconnect() {
        clearTimeout(reconnectTimer);
        const delay = Math.min(RECONNECT_BASE_DELAY * 1.6 ** reconnectAttempts, RECONNECT_MAX_DELAY) + Math.random() * 300;
        reconnectAttempts++;
        reconnectTimer = setTimeout(connect, delay);
    }

    function setConnStatus(cls, text) {
        connStatus.className = `visible ${cls}`;
        connStatus.textContent = text;
    }

    // ── Message handler ────────────────────────────────────────────────────
    function handleMessage(msg) {
        // Output Looks: this output's own Bible/Slide/Media/Timer visibility
        // (see applyOutputLayers/pickLayers above) — a disabled layer simply
        // never renders new content; toggling it back on picks up the next
        // real update normally (no separate "resend" needed, matching how
        // the real output already behaves after any other kind of
        // reconnect).
        //
        // Bible vs. Slide: this same 'detection' message type carries BOTH
        // auto-detected/manually-sent scripture AND a plain Slides-tab
        // slide (they share one send path — see the server's /api/service/
        // send) — real scripture always carries book/chapter/verse, a
        // plain slide never does, so that's the classifier. No separate
        // "kind" field needed. Bible takes precedence when a message could
        // ever read as either (owner: "by their order, bible supersedes
        // because it's the top").
        if (msg.type === 'detection' && msg.target === 'viewer') {
            const verse = msg.verses && msg.verses[0];
            const isBible = !!(verse && verse.book && verse.chapter && verse.verse);
            if (isBible ? !outputLayers.bible : !outputLayers.slide) return;
            if (verse) noteConfidenceSlide(verse, isBible, msg.next);
            if (verse) {
                currentSlideIsBible = isBible;
                if (!verse.image) currentImageSlide = null;
                // A playlist item may carry its own theme (lyrics vs scripture).
                // Anything without one falls back to this output's assigned theme.
                applyContentLook(msg.look);
                if (verse.image) {
                    // Image slides bypass the text layers entirely — there is no
                    // verse text to bind, just the picture, full-frame.
                    currentVerseText = '';
                    currentVerseRef  = verse.reference || verse.ref || '';
                    renderImageStage(verse.image, true, verse.fit || 'contain');
                } else {
                    showVerse(verse.text || verse.verse || '', verse.reference || verse.ref || '', false, verse.translatedText || '', verse.slideStyle || {}, verse.timerText || '');
                }
            }
            return;
        }

        if (msg.type === 'range-active') {
            // A range is always a formally-cited scripture passage — always
            // the Bible layer, never Slide.
            if (!outputLayers.bible) return;
            const verse = msg.verses && msg.verses[0];
            if (verse) {
                noteConfidenceSlide(verse, true, null);
                currentSlideIsBible = true;
                currentImageSlide = null;
                showVerse(verse.text || verse.verse || '', verse.reference || verse.ref || '', true, verse.translatedText || '');
            } else {
                setRangeActive(true);
            }
            return;
        }

        if (msg.type === 'range-end') {
            setRangeActive(false);
            confNextRange = null;
            renderConfidenceView();
            return;
        }

        // The verse a range goes to next — the Monitor view's "Next".
        if (msg.type === 'range-state') {
            confNextRange = msg.remaining > 0 && msg.next ? msg.next : null;
            renderConfidenceView();
            return;
        }

        if (msg.type === 'monitor-message') {
            // Who it is for: the Monitors (the stage), the audience screens, or both.
            const to = msg.to || 'monitors';
            lastMessage = { text: msg.text || '', to };
            setMonitorMessage(to === 'screens' ? '' : msg.text);
            drawMessageBanner();
            return;
        }

        // Legacy whole-stage clear — nothing sends this anymore (clear-layer
        // with layer:'all' replaced it) but keep it as an alias in case
        // anything external still posts the old shape.
        if (msg.type === 'clear') {
            clearDisplay();
            renderMediaStage(null);
            noteConfidenceSlide(null);
            return;
        }

        if (msg.type === 'clear-layer') {
            if (msg.layer === 'slide' || msg.layer === 'all') { clearDisplay(); noteConfidenceSlide(null); }
            if (msg.layer === 'timer' || msg.layer === 'all') updateConfidenceTimer({ cleared: true });
            if (msg.layer === 'media' || msg.layer === 'all') transitionMedia(null);
            // Cosmetic only — the server-side clear-timer/clear-all handlers
            // actually stop the live segment's trigger *before* sending this,
            // so nothing broadcasts a fresh remainingMs a moment later to
            // silently bring the badge back.
            if (msg.layer === 'timer' || msg.layer === 'all') {
                timerBadgeEl?.classList.add('hidden');
                clockBadgeEl?.classList.add('hidden');
                if (timerLayer) timerLayer.innerHTML = ''; // clear the full-screen countdown too
                // A scene's backdrop lives on the shared media layer (see
                // renderTimerScene) — this is the actual "Clear Timer" button's
                // path (clearOutputLayer('timer') → clear-layer, not
                // timer-slide{clear:true}), so it needs the same media/state
                // reset that branch already does, or a scene's image/video
                // stays stuck full-screen after the countdown is cleared.
                if (timerScenes && timerScenes.length) renderMediaStage(null);
                timerScenes = null;
                activeSceneIndex = -1;
                activeSceneSlot = -1;
            }
            return;
        }

        if (msg.type === 'media' && msg.target === 'viewer') {
            if (!outputLayers.media) return;
            transitionMedia(msg.src, msg.kind, msg.fit);
            return;
        }

        // A segment went live — paint its themed countdown into the
        // independent timer layer (or clear it). The slide layer is left
        // exactly as it was.
        if (msg.type === 'timer-slide') {
            if (!outputLayers.timer) return;
            // Uses the look carried in the message directly — never touches
            // activeLook, so the slide layer's own theme is unaffected.
            if (msg.clear) {
                timerLayer.innerHTML = '';
                // A scene's backdrop lives on the shared media layer now
                // (see renderTimerScene) — clear that too, or it'd be left
                // showing with nothing on top once the countdown stops.
                if (timerScenes && timerScenes.length) renderMediaStage(null);
                timerScenes = null;
                activeSceneIndex = -1;
                activeSceneSlot = -1;
            } else if (msg.scenes && msg.scenes.length) {
                timerScenes = msg.scenes;
                timerScenePace = msg.pace || null;
                // An edit to the running countdown (a slide, the pace) resends
                // it: carry on from the slide and time the countdown is at,
                // rather than cutting back to the first slide at 0:00 until
                // the next tick.
                const t = msg.resend && lastTimerTick && Date.now() - lastTimerTick.at < 3000 ? lastTimerTick : null;
                const at = t ? activeSceneForElapsed(Math.max(0, t.totalMs - t.remainingMs), t.totalMs) : { index: 0, slot: 0 };
                activeSceneIndex = at.index;
                activeSceneSlot = at.slot ?? at.index;
                if (!t) currentTimerText = msg.timerText || '0:00';
                renderTimerScene(at.index, { builds: !t });   // an edit repaints in place; a start arrives
            } else {
                // A plain (non-scene) segment starting right after a scene
                // segment was live — clear any scene backdrop the previous
                // segment left on the shared media layer, or it stays stuck
                // full-screen underneath this segment's own theme.
                if (timerScenes && timerScenes.length) renderMediaStage(null);
                timerScenes = null;
                activeSceneIndex = -1;
                activeSceneSlot = -1;
                renderTimerLayer(msg.look, msg.style || {}, msg.timerText || '0:00', { builds: true });
            }
            return;
        }

        if (msg.type === 'media-control') {
            applyMediaControl(msg.action, msg.value);
            return;
        }

        if (msg.type === 'output-transition') {
            if (msg.animation) outputAnimation = msg.animation;
            if (typeof msg.speed === 'number' && msg.speed > 0) outputAnimationSpeed = msg.speed;
            if (CAPTURE) captureTransition();
            return;
        }

        if (msg.type === 'overlays') {
            lastOverlays = msg.items || [];
            drawOverlays();
            return;
        }

        if (msg.type === 'audio-output') {
            applyAudioOutput(msg.deviceId);
            return;
        }

        // look-update: main window broadcasts theme assignments. Take the entry
        // for this output, or the single look in the legacy payload shape.
        if (msg.type === 'look-update') {
            if (msg.modes && typeof msg.modes === 'object') { try { applyOutputMode(msg.modes[OUTPUT_KEY]); } catch {} }
            const mine = pickLook(msg);
            if (mine) { assignedLook = mine; try { applyLook(frameBaseLook(), true); } catch {} }
            const myLayers = pickLayers(msg);
            if (myLayers) { try { applyOutputLayers(myLayers); } catch {} }
            if (msg.frames && typeof msg.frames === 'object' && !PREVIEW) { try { setFrame(msg.frames[OUTPUT_KEY] || null); } catch {} }
            if (msg.monitors && typeof msg.monitors === 'object') { try { setMonitorLook(msg.monitors[OUTPUT_KEY] || null); } catch {} }
            if (msg.keying && typeof msg.keying === 'object') { try { applyOutputKeying(msg.keying[OUTPUT_KEY]); } catch {} }
            return;
        }

        // Generic action/trigger broadcast (the server's Triggers (kairo-server library.rs)) — a
        // segment's stage-timer countdown or the system-clock message.
        // Two independent badges (see #timer-badge/#clock-badge above),
        // not one shared slot, so both can be showing at once without
        // overwriting each other every tick.
        if (msg.type === 'action') {
            if (msg.actionId === 'stage-timer' && outputLayers.timer) updateConfidenceTimer(msg.payload);
            handleActionBadge(msg);
            return;
        }
    }

    // ── Output mode changes ────────────────────────────────────────────────
    let currentImageSlide = null;    // { src, fit } — a picture slide is what's showing
    let lastMediaArgs = null;        // the media layer's content, kept while it isn't shown
    let lastTimerLayerArgs = null;   // the timer layer's theme and text, for a repaint
    function applyOutputMode(mode) {
        if (!OUTPUT_MODES.includes(mode)) mode = 'theme';
        if (mode === outputMode) return;
        outputMode = mode;
        document.body.dataset.mode = mode;
        if (mode === 'theme' && lastMediaArgs) renderMediaStage(...lastMediaArgs);
        else if (mode !== 'theme') mediaLayer.innerHTML = '';
        if (mode === 'confidence') { startConfidenceClock(); renderConfidenceView(); } else stopConfidenceClock();
        if (mode === 'multiview') startMultiview(); else stopMultiview();
        // A layout frame shows on theme outputs only.
        try { setFrame(requestedFrame); } catch {}
        // Repaint with (or without) everything that isn't words.
        if (currentImageSlide) renderImageStage(currentImageSlide.src, false, currentImageSlide.fit);
        else applyLook(activeLook, false);
        if (lastTimerLayerArgs) renderTimerLayer(...lastTimerLayerArgs);
    }

    // ── Monitor view: the confidence monitor ───────────────────────────────
    // A Monitor output (owner, 2026-10-01: "Caters to the minister up front.
    // just like propresenter stage output" — "call it Monitor, not stage"):
    // what's on screen now with the next slide right under it, the time, the
    // segment's countdown, and a message from the booth. Words only. A single
    // scripture called out shows just that verse. Fed by the same broadcasts
    // as every output; "Next" is the range's next verse for scripture, or the
    // next slide the playlist sent along (service.js nextSlideInfo).
    const cvClock = document.getElementById('cv-clock');
    const cvTimer = document.getElementById('cv-timer');
    const cvTimerLabel = document.getElementById('cv-timer-label');
    const cvTimerValue = document.getElementById('cv-timer-value');
    const cvRef = document.getElementById('cv-ref');
    const cvText = document.getElementById('cv-text');
    const cvNext = document.getElementById('cv-next');
    const cvNextRef = document.getElementById('cv-next-ref');
    const cvNextText = document.getElementById('cv-next-text');
    const cvMessage = document.getElementById('cv-message');
    let confCurrent = null;     // { text, ref, image, bible }
    let confNextSlide = null;   // the playlist's next slide, sent with this one
    let confNextRange = null;   // the range's next verse (range-state)

    function confRefOf(v) {
        const ref = v.reference || v.ref || '';
        return v.label ? (ref ? `${v.label} · ${ref}` : v.label) : ref;
    }
    function noteConfidenceSlide(verse, isBible, next) {
        confCurrent = verse ? {
            text: verse.image ? '' : (verse.text || verse.verse || ''),
            ref: confRefOf(verse),
            image: !!verse.image,
            bible: !!isBible,
            book: verse.book, chapter: verse.chapter, verse: verse.verse,
        } : null;
        confNextSlide = verse && !isBible && next ? next : null;
        renderConfidenceView();
    }
    // The range's next verse belongs under this verse only when the reading
    // goes on from it — a single scripture called out mid-range shows alone.
    function rangeGoesOnFrom(cur) {
        const n = confNextRange;
        if (!n || n.book !== cur.book) return false;
        return n.chapter === cur.chapter ? n.verse > cur.verse : n.chapter === cur.chapter + 1;
    }
    // ── A Monitor layout (Theme Studio's Monitor layouts) ──
    // Drawn by the same renderer as every theme; its own bindings (the next slide, the time,
    // the message) are filled from what the built-in view shows, and kept current.
    function isMonitorBinding(b) { return b === 'mon-next' || b === 'mon-next-ref' || b === 'mon-clock' || b === 'mon-message'; }
    const monitorLookEl = document.getElementById('monitor-look');
    let monitorLook = null;
    let monitorTimer = { text: '', warning: false, overtime: false };
    function monitorBindingText(b) {
        const cur = confCurrent;
        const next = confNext();
        if (b === 'mon-next') return next ? (next.text || next.verse || (next.image ? 'Picture' : '')) : '';
        if (b === 'mon-next-ref') return next ? `Next${confRefOf(next) ? ' · ' + confRefOf(next) : ''}` : '';
        if (b === 'mon-clock') return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        if (b === 'mon-message') return cvMessage.hidden ? '' : cvMessage.textContent;
        return '';
    }
    function setMonitorLook(look) {
        monitorLook = look && Array.isArray(look.layers) ? look : null;
        document.body.classList.toggle('has-monitor-look', !!monitorLook);
        renderMonitorLook();
    }
    function renderMonitorLook() {
        if (!monitorLook || outputMode !== 'confidence') return;
        const cur = confCurrent;
        const text = !cur ? '' : cur.text || (cur.image ? 'Picture on screen' : '');
        const { frag } = buildLayerDOM(monitorLook, text, cur ? cur.ref : '', '', {}, monitorTimer.text, false, {});
        monitorLookEl.innerHTML = '';
        monitorLookEl.appendChild(frag);
        refreshMonitorLook();
    }
    // The parts that change by themselves (the time, the countdown, the message) without a redraw.
    function refreshMonitorLook() {
        if (!monitorLook || outputMode !== 'confidence') return;
        monitorLookEl.querySelectorAll('[data-binding]').forEach(el => {
            const b = el.dataset.binding;
            if (isMonitorBinding(b)) { const t = monitorBindingText(b); if (el.textContent !== t) el.textContent = t; }
            else if (b === 'timer') { el.textContent = monitorTimer.text; el.classList.toggle('is-warning', monitorTimer.warning); el.classList.toggle('is-overtime', monitorTimer.overtime); }
        });
        fitMonitorLook();
    }
    // Each text as large as its box allows (from its designed size), like the verse on a screen.
    function fitMonitorLook() {
        const H = monitorLookEl.clientHeight || window.innerHeight;
        if (H < 50) return;
        monitorLookEl.querySelectorAll('[data-eff-pos]').forEach(el => {
            let p; try { p = JSON.parse(el.dataset.effPos); } catch { return; }
            if (!p || !(p.h > 0)) return;
            const maxH = H * (p.h / DESIGN_H);
            let size = parseFloat(el.dataset.baseSize) || 48;
            el.style.fontSize = size + 'px';
            const prevH = el.style.height;
            el.style.height = 'auto';
            let guard = 60;
            while (el.scrollHeight > maxH && size > 12 && guard-- > 0) { size = Math.floor(size * 0.94); el.style.fontSize = size + 'px'; }
            el.style.height = prevH;
        });
    }
    // What goes under "Next": the range's next verse when the reading goes on, else the
    // playlist's next slide.
    function confNext() {
        const cur = confCurrent;
        return cur ? (cur.bible ? (rangeGoesOnFrom(cur) ? confNextRange : null) : confNextSlide) : null;
    }
    function renderConfidenceView() {
        if (outputMode !== 'confidence') return;
        renderMonitorLook();
        const cur = confCurrent;
        cvRef.textContent = cur ? cur.ref : '';
        const empty = !cur || !cur.text;
        cvText.textContent = !cur ? 'Nothing on screen' : cur.text || (cur.image ? 'Picture on screen' : 'Nothing on screen');
        cvText.classList.toggle('is-empty', empty);
        const next = confNext();
        const nextText = next ? (next.text || next.verse || (next.image ? 'Picture' : '')) : '';
        cvNext.hidden = !next || (!nextText && !confRefOf(next));
        cvNextRef.textContent = next ? confRefOf(next) : '';
        cvNextText.textContent = typeof nextText === 'string' ? nextText : '';
        fitConfidenceText();
    }
    // The words as large as the space allows, down to a readable floor.
    function fitConfidenceText() {
        if (outputMode !== 'confidence') return;
        const box = cvText.clientHeight;
        if (box < 20) return;
        const vh = window.innerHeight / 100;
        let size = 11 * vh;
        cvText.style.fontSize = size + 'px';
        let guard = 40;
        while (cvText.scrollHeight > box + 1 && size > 3 * vh && guard-- > 0) {
            size *= 0.92;
            cvText.style.fontSize = size + 'px';
        }
    }
    function updateConfidenceTimer(p) {
        const { remainingMs, label, cleared } = p || {};
        if (cleared || typeof remainingMs !== 'number') { cvTimer.hidden = true; monitorTimer = { text: '', warning: false, overtime: false }; refreshMonitorLook(); return; }
        const overtime = remainingMs < 0;
        const warning = !overtime && remainingMs <= 60000;
        monitorTimer = { text: (overtime ? '+' : '') + formatMs(Math.abs(remainingMs)), warning, overtime };
        refreshMonitorLook();
        cvTimer.hidden = false;
        cvTimerLabel.textContent = label || 'Timer';
        cvTimerValue.textContent = (overtime ? '+' : '') + formatMs(Math.abs(remainingMs));
        cvTimer.classList.toggle('is-overtime', overtime);
        cvTimer.classList.toggle('is-warning', warning);
    }
    // The audience-screen banner: shown on a non-Monitor output when the message is for the
    // screens and this output's Messages switch (Output Control) is on.
    let lastMessage = { text: '', to: 'monitors' };
    function drawMessageBanner() {
        const el = document.getElementById('message-banner');
        if (!el) return;
        const t = String(lastMessage.text || '').trim();
        const show = !!t && (lastMessage.to === 'screens' || lastMessage.to === 'all') && outputLayers.message !== false && !MONITOR;
        if (show) el.textContent = t;
        el.hidden = !show;
    }
    function setMonitorMessage(text) {
        const t = String(text || '').trim();
        if (!t) { cvMessage.hidden = true; cvMessage.textContent = ''; fitConfidenceText(); refreshMonitorLook(); return; }
        if (cvMessage.textContent === t && !cvMessage.hidden) return;
        cvMessage.textContent = t;
        cvMessage.hidden = false;
        refreshMonitorLook();
        cvMessage.classList.remove('is-new');
        void cvMessage.offsetWidth;   // restart the arrival flash
        cvMessage.classList.add('is-new');
        fitConfidenceText();   // the words make room for it
    }
    let confidenceClockTimer = null;
    function tickConfidenceClock() {
        cvClock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const clocks = monitorLook ? monitorLookEl.querySelectorAll('[data-binding="mon-clock"]') : [];
        clocks.forEach(el => { if (el.textContent !== cvClock.textContent) el.textContent = cvClock.textContent; });
    }
    function startConfidenceClock() {
        tickConfidenceClock();
        if (!confidenceClockTimer) confidenceClockTimer = setInterval(tickConfidenceClock, 1000);
    }
    function stopConfidenceClock() { clearInterval(confidenceClockTimer); confidenceClockTimer = null; }
    if (outputMode === 'confidence') { startConfidenceClock(); renderConfidenceView(); }

    const timerBadgeEl = document.getElementById('timer-badge');
    const clockBadgeEl = document.getElementById('clock-badge');
    function formatMs(ms) {
        const totalSec = Math.max(0, Math.ceil(ms / 1000));
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return h > 0
            ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
            : `${m}:${String(s).padStart(2, '0')}`;
    }
    // The individual hour/minute/second digits, zero-padded — lets a text
    // layer bind to just one part (binding: 'timer-h'/'timer-m'/'timer-s',
    // see renderTextProps' "Binds to" chips) instead of only the combined
    // string 'timer' gives. That's what actually lets an operator stack
    // the hour over the minute (or build any other layout of the pieces):
    // two independently positioned/sized/styled text layers, one per part,
    // rather than one fixed "H:MM:SS" string with no layout control at all
    // beyond the one text box it lives in.
    function timeParts(ms) {
        const totalSec = Math.max(0, Math.ceil(ms / 1000));
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return { h: String(h).padStart(2, '0'), m: String(m).padStart(2, '0'), s: String(s).padStart(2, '0') };
    }
    // Shared by every timer-bound element (the combined 'timer' string AND
    // each individual 'timer-h'/'timer-m'/'timer-s' part) — one place for
    // the warning/overtime class + recolour logic instead of copy-pasting
    // it once per binding.
    function applyTimerStateStyle(el, overtime, warning, cleared) {
        el.classList.toggle('is-overtime', overtime && !cleared);
        el.classList.toggle('is-warning', warning && !cleared);
        const base = el.dataset.baseColor;
        if (base) {
            el.style.color = cleared ? base
                : overtime ? (el.dataset.overtimeColor || '#ed1c24')
                : warning  ? (el.dataset.warnColor || '#e8a64a')
                : base;
        }
    }
    // The latest countdown tick, so a resent countdown (see 'timer-slide')
    // can pick up at the right slide.
    let lastTimerTick = null;   // { remainingMs, totalMs, at }
    // Time's up: a countdown on the screen ends there (owner, 2026-10-01: "does
    // the timer not supposed to clear off the screen if the preservice time is
    // complete?") — its design, the corner badge, any {timer} text. It still
    // counts on into overtime for the operator's own view and on Monitor
    // outputs (updateConfidenceTimer), for whoever is up front.
    let countdownEnded = false;
    function endCountdownOnScreen() {
        timerBadgeEl?.classList.add('hidden');
        if (timerLayer) timerLayer.innerHTML = '';
        lastTimerLayerArgs = null;
        if (timerScenes && timerScenes.length) renderMediaStage(null);
        timerScenes = null;
        activeSceneIndex = -1;
        activeSceneSlot = -1;
        stage.querySelectorAll('[data-binding="timer"],[data-binding="timer-h"],[data-binding="timer-m"],[data-binding="timer-s"],[data-timer-template]')
            .forEach(el => { el.textContent = ''; });
        currentTimerText = '';
    }
    function handleActionBadge(msg) {
        if (msg.actionId === 'stage-timer') {
            const { remainingMs, label, cleared, style, totalMs } = msg.payload || {};
            if (!cleared && remainingMs <= 0) {
                if (!countdownEnded) { countdownEnded = true; endCountdownOnScreen(); }
                lastTimerTick = null;
                return;
            }
            countdownEnded = false;
            lastTimerTick = !cleared && typeof totalMs === 'number' && totalMs > 0 ? { remainingMs, totalMs, at: Date.now() } : null;
            // Two independent render targets share this one tick: the fixed
            // corner badge (always available, no theme needed) and — if this
            // segment was actually sent to the slide layer with a theme that
            // has a real 'timer'-bound layer (sendSlide/toggleSegment in
            // service.js) — that on-stage layer too. Both need to clear on
            // an explicit stop, so that has to happen before either one's
            // early-return, not stop at the badge and leave the on-stage
            // layer frozen on its last value forever.
            const overtime = remainingMs < 0;
            // Inside the last minute but not yet at zero — a heads-up step
            // before overtime, not just a jump from plain to red at 0:00.
            const warning = !overtime && remainingMs <= 60000;
            const formatted = cleared ? '' : (overtime ? '+' : '') + formatMs(Math.abs(remainingMs));
            // The themed on-stage layer needs the same warning/overtime
            // treatment as the fixed corner badge below — it was only
            // getting a textContent update before, so a themed timer (any
            // color chosen in Full-scale edit) stayed that color forever
            // instead of ever changing as the countdown ran down.
            stage.querySelectorAll('[data-binding="timer"]').forEach(el => {
                el.textContent = formatted;
                applyTimerStateStyle(el, overtime, warning, cleared);
            });
            // Individual hour/minute/second parts — same state styling,
            // just a single zero-padded piece per element instead of the
            // whole formatted string. Sign (+ for overtime) only makes
            // sense on the combined string above; a lone "+05" minutes
            // reads as confusing, so these three just keep counting the
            // way they were rather than carrying their own sign.
            if (!cleared) {
                const parts = timeParts(Math.abs(remainingMs));
                stage.querySelectorAll('[data-binding="timer-h"]').forEach(el => { el.textContent = parts.h; applyTimerStateStyle(el, overtime, warning, cleared); });
                stage.querySelectorAll('[data-binding="timer-m"]').forEach(el => { el.textContent = parts.m; applyTimerStateStyle(el, overtime, warning, cleared); });
                stage.querySelectorAll('[data-binding="timer-s"]').forEach(el => { el.textContent = parts.s; applyTimerStateStyle(el, overtime, warning, cleared); });
            } else {
                stage.querySelectorAll('[data-binding="timer-h"],[data-binding="timer-m"],[data-binding="timer-s"]').forEach(el => {
                    el.textContent = '';
                    applyTimerStateStyle(el, overtime, warning, cleared);
                });
            }
            currentTimerText = formatted;

            // Motion graphics that follow the countdown (ring, bar, dots).
            window.KairoMotion?.tick(document, { remainingMs, totalMs, cleared });

            // Custom text with a "{timer}" placeholder (see the
            // hasTimerTemplate note in buildLayerDOM) — substitutes the
            // live formatted countdown into that ONE spot in an otherwise
            // static sentence, on every tick, same as the plain 'timer'
            // binding's own textContent update above just for a whole
            // sentence instead of only the number. Deliberately no
            // warning/overtime recolour here — degrading a full sentence
            // to red/yellow at the end reads as broken, not urgent, the
            // way it does for a lone number.
            stage.querySelectorAll('[data-timer-template]').forEach(el => {
                el.textContent = el.dataset.timerTemplate.replace('{timer}', formatted);
            });

            // Scene storyboard (segment.scenes) — switch the WHOLE layer
            // set the moment elapsed time crosses into the next scene's
            // window, then advance that scene's own image-cycle layer(s)
            // on THEIR fixed intervalSec pace rather than the whole-
            // countdown spacing the plain single-theme case (below) uses.
            // Runs even in overtime/cleared-adjacent ticks so the last
            // scene keeps looping instead of freezing mid-cycle the
            // instant the countdown crosses zero.
            if (!cleared && timerScenes && timerScenes.length && typeof totalMs === 'number' && totalMs > 0) {
                const elapsed = Math.max(0, totalMs - remainingMs);
                const { index, sceneElapsedMs, slot } = activeSceneForElapsed(elapsed, totalMs);
                const showing = slot ?? index;
                if (index !== activeSceneIndex || showing !== activeSceneSlot) {
                    // A segment saved before pacing existed keeps its hard cut.
                    const transition = timerScenePace && window.KairoMotion ? window.KairoMotion.normalizePace(timerScenePace).transition : 'cut';
                    const first = activeSceneIndex < 0;
                    activeSceneIndex = index;
                    activeSceneSlot = showing;
                    renderTimerScene(index, { transition: first ? 'cut' : transition });
                } else {
                    stage.querySelectorAll('[data-cycle-images][data-cycle-interval]').forEach(el => {
                        let sources;
                        try { sources = JSON.parse(el.dataset.cycleImages); } catch { return; }
                        if (!sources || !sources.length) return;
                        const intervalMs = Math.max(200, parseFloat(el.dataset.cycleInterval) * 1000);
                        const idx = Math.floor(sceneElapsedMs / intervalMs) % sources.length;
                        if (String(idx) === el.dataset.cycleIndex) return;
                        el.dataset.cycleIndex = String(idx);
                        swapCycleImage(el, sources[idx], el.dataset.cycleTransition);
                    });
                }
            }

            // Image Cycle — advance the pre-service slideshow evenly across
            // the whole countdown (totalMs, captured once at fire time by
            // triggers.js) rather than on a fixed interval, so the last
            // image lands right as the countdown hits zero. cleared/overtime
            // both freeze on whichever frame is already showing — there's
            // no "whole countdown" left to space across in either case.
            // Excludes [data-cycle-interval] layers — those are a scene's
            // own, spaced and advanced by the block above instead.
            if (!cleared && typeof totalMs === 'number' && totalMs > 0 && !overtime) {
                const elapsed = Math.min(totalMs, Math.max(0, totalMs - remainingMs));
                stage.querySelectorAll('[data-cycle-images]:not([data-cycle-interval])').forEach(el => {
                    let sources;
                    try { sources = JSON.parse(el.dataset.cycleImages); } catch { return; }
                    if (!sources || !sources.length) return;
                    const idx = Math.min(sources.length - 1, Math.floor((elapsed / totalMs) * sources.length));
                    if (String(idx) === el.dataset.cycleIndex) return;
                    el.dataset.cycleIndex = String(idx);
                    swapCycleImage(el, sources[idx], el.dataset.cycleTransition);
                });
            }

            // The fixed corner badge is the FALLBACK countdown display for a
            // plain segment with no theme ("always available, no theme
            // needed" — see the comment above). Once a segment ships a real
            // scene storyboard, the scene owns the countdown's presentation
            // entirely — its own corner readout, or the countdown woven
            // right into a headline via {timer} — so leaving this fixed
            // badge showing too just draws the same number a second (or
            // third) time in the corner. Hide it whenever scenes are driving
            // the layer; #clock-badge is untouched, since that's the
            // operator's own separate Live Clock/clock-message toggle, not
            // part of this redundancy.
            if (!timerBadgeEl) return;
            if (cleared || (timerScenes && timerScenes.length)) { timerBadgeEl.classList.add('hidden'); return; }
            timerBadgeEl.classList.remove('hidden');
            // Overtime, not "ended" — the countdown keeps going past zero
            // (see triggers.js) until the operator actually stops it, so it
            // switches to counting up in red instead of just disappearing.
            timerBadgeEl.classList.toggle('is-overtime', overtime);
            timerBadgeEl.classList.toggle('is-warning', warning);
            // A custom font style is per-segment (see the countdown-style
            // popover in service.js); warning/overtime color always wins
            // over it — clearing the inline color lets the .is-warning /
            // .is-overtime CSS rules apply instead of a same-priority
            // inline color fighting them.
            timerBadgeEl.style.fontFamily = style?.fontFamily || '';
            timerBadgeEl.style.fontSize   = style?.fontSize ? style.fontSize + 'px' : '';
            timerBadgeEl.style.fontWeight = style?.fontWeight || '';
            timerBadgeEl.style.color      = (!overtime && !warning && style?.color) ? style.color : '';
            // No segment name in the output — the congregation just needs the
            // number. (Operator still sees which segment is live in-app.)
            timerBadgeEl.textContent = formatted;
        } else if (msg.actionId === 'clock-message') {
            if (!clockBadgeEl) return;
            const { now, format, cleared } = msg.payload || {};
            if (cleared) { clockBadgeEl.classList.add('hidden'); return; }
            const d = new Date(now || Date.now());
            const text = format === '12h' ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                                           : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            clockBadgeEl.classList.remove('hidden');
            clockBadgeEl.textContent = text;
        }
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    // 1. Load active look from localStorage
    activeLook = loadActiveLook() || FALLBACK_LOOK;
    assignedLook = activeLook;   // baseline this output reverts to
    // A layout's frame saved by the main window (Director mode).
    if (!PREVIEW) { try { const fm = JSON.parse(localStorage.getItem('kairo-output-frames') || 'null'); if (fm && fm[OUTPUT_KEY]) setFrame(fm[OUTPUT_KEY]); } catch {} }
    try { const ml = JSON.parse(localStorage.getItem('kairo-monitor-looks') || 'null'); if (ml && ml[OUTPUT_KEY]) setMonitorLook(ml[OUTPUT_KEY]); } catch {}
    window.addEventListener('resize', () => { try { fitMonitorLook(); } catch {} });

    // 2. Start genuinely blank — nothing painted yet, not even the theme's
    // background — until the first real slide/verse actually arrives. See
    // renderStage's comment for why an eagerly-painted empty slide layer
    // is a problem now that there's a media layer behind it.

    // 3. Connect WebSocket (after the auth token is loaded so the upgrade
    //    URL carries it; falls back to unauthed when not running under Tauri).
    if (!PREVIEW) loadAuthToken().finally(connect);   // the Preview is fed by its parent, not the socket

    // 4. Reveal the window now that its own dark CSS has actually settled.
    // openDisplayWindow (index.html) creates this window hidden — same
    // fix as the main window's own splash->show sequence, same reason: a
    // window visible immediately by default shows WebKit's default WHITE
    // background before this page's CSS paints, which on the actual
    // output screen read as a black/white/black flash on every open. A
    // short timer, not requestAnimationFrame — an invisible surface never
    // gets a compositing pass to synchronize against, so rAF here would
    // simply never fire (confirmed the hard way on the main window).
    // ── Capture mode (?capture=1) ──────────────────────────────────────
    // The hidden window behind an NDI / Syphon output (src/output_capture.js,
    // src-tauri capture.rs): it renders this output's theme like a screen
    // would, and asks the app to snapshot it whenever what it shows changes.
    // Changes are drawn at once here; the output itself blends old into new
    // for a Fade (a snapshot takes ~64 ms, too slow to film a transition).
    // Timers only: a hidden window never gets requestAnimationFrame.
    let captureFadeMs = 0;
    function captureTransition() {
        captureFadeMs = outputAnimation === 'cut' ? 0 : Math.round(300 * outputAnimationSpeed);
        outputAnimation = 'cut';
    }
    if (CAPTURE) {
        captureTransition();
        const outputParam = params.get('capid') || params.get('output') || '';
        const capW = Math.max(16, parseInt(params.get('w'), 10) || 1920);
        const capH = Math.max(16, parseInt(params.get('h'), 10) || 1080);
        const invoke = window.__TAURI__?.core?.invoke;
        let wait = null, fade = 0;
        // A full-frame video background is played by the app itself at the
        // output's own rate (src-tauri video_bg.rs): here it isn't drawn —
        // nor anything it covers — so the snapshots carry only what sits on
        // top of it, with transparency. Anything smaller or see-through stays
        // in the snapshots as before.
        let baseVideo = null, baseKey = '';
        const refused = new WeakSet(); // the app couldn't play these: they stay in the snapshots
        const fullFrame = (v) => {
            const r = v.getBoundingClientRect(), cs = getComputedStyle(v);
            return r.left <= 1 && r.top <= 1 && r.right >= innerWidth - 1 && r.bottom >= innerHeight - 1
                && parseFloat(cs.opacity) >= 0.99 && cs.visibility !== 'hidden' && cs.display !== 'none'
                && (!cs.borderRadius || cs.borderRadius === '0px') && (!cs.transform || cs.transform === 'none')
                && !cs.animationName.includes('kenburns') && /^\/api\//.test(new URL(v.currentSrc || v.src, location.href).pathname);
        };
        // The topmost (latest in the page) full-frame video; the one already
        // handed over stays while it's still there (it's hidden now).
        const pickBaseVideo = () => {
            let best = null;
            document.querySelectorAll('#media-layer video, #slide-layer video').forEach(v => {
                if (refused.has(v)) return;
                if (v === baseVideo ? v.isConnected : fullFrame(v)) best = v;
            });
            return best;
        };
        const syncBaseVideo = () => {
            const v = pickBaseVideo();
            const src = v ? new URL(v.currentSrc || v.src, location.href) : null;
            if (src) src.searchParams.delete('token');
            const key = src ? `${src.pathname}${src.search}|${getComputedStyle(v).objectFit}` : '';
            if (v === baseVideo && key === baseKey) return;
            document.querySelectorAll('.cap-under').forEach(e => e.classList.remove('cap-under'));
            baseVideo = v; baseKey = key;
            if (v) {
                // the video, everything drawn before it in its layer, and the media layer under a theme's own
                v.classList.add('cap-under');
                for (let e = v.previousElementSibling; e; e = e.previousElementSibling) e.classList.add('cap-under');
                if (v.closest('#slide-layer')) document.getElementById('media-layer')?.classList.add('cap-under');
                try { v.pause(); } catch {}
            }
            invoke('output_video', { id: outputParam, url: src ? src.pathname + src.search : null, fit: v ? getComputedStyle(v).objectFit : null, width: capW, height: capH })
                .catch((err) => {
                    // The app can't play it: draw it here again, as before.
                    console.warn('[capture] video background stays in the snapshots:', err);
                    if (!v || baseVideo !== v) return;
                    refused.add(v);
                    document.querySelectorAll('.cap-under').forEach(e => e.classList.remove('cap-under'));
                    baseVideo = null; baseKey = '';
                    v.play().catch(() => {});
                    request(0);
                });
        };
        const request = (fadeMs) => {
            if (!invoke) return;
            fade = Math.max(fade, fadeMs);
            clearTimeout(wait);
            // Long enough for layout, images and fonts of a change to settle.
            wait = setTimeout(() => {
                syncBaseVideo();
                const f = fade; fade = 0;
                invoke('output_capture', { id: outputParam, width: capW, height: capH, fadeMs: f }).catch(() => {});
            }, 60);
        };
        const timer = document.getElementById('timer-layer');
        let settle = [];
        new MutationObserver((records) => {
            // The app switching the backdrop between its two snapshots isn't a change.
            records = records.filter(r => !(r.target === document.documentElement && r.attributeName === 'data-cap-bg'));
            if (!records.length) return;
            // The timer ticking or a clock isn't a slide change: no fade.
            const onlyTimer = records.every(r => timer && timer.contains(r.target));
            request(onlyTimer ? 0 : captureFadeMs);
            if (!onlyTimer) {
                // Background images and fonts of a new slide can land after
                // it's drawn (a CSS background announces nothing): look again.
                settle.forEach(clearTimeout);
                settle = [350, 1100].map(ms => setTimeout(() => request(0), ms));
            }
        }).observe(document.body, { subtree: true, childList: true, attributes: true, characterData: true });
        document.addEventListener('load', () => request(0), true);   // images that finish later
        document.fonts?.ready?.then(() => request(0));
        // A playing video: as often as a snapshot allows.
        setInterval(() => {
            if ([...document.querySelectorAll('video')].some(v => v !== baseVideo && !v.paused && !v.ended)) request(0);
        }, 70);
        setTimeout(() => request(0), 300);
    }

    setTimeout(() => {
        if (MONITOR) return;   // a monitor copy lives inside the operator window
        const w = window.__TAURI__?.window?.getCurrentWindow?.();
        if (!w) return;
        w.show().catch(() => {});
        // Fullscreen is requested HERE, after show() — not at window
        // creation (index.html's own WebviewWindow options deliberately
        // pass fullscreen:false now) — see index.html's own comment for
        // why: requesting it at creation made macOS's native fullscreen-
        // transition animation (a real cross-fade, not an instant cut —
        // "white screen before fading to black") capture its "before"
        // frame from the window's default backing store, before this
        // page had painted anything dark at all. Doing it now means real
        // dark content already exists to fade FROM.
        if (params.get('fs') === '1') w.setFullscreen(true).catch(() => {});
    }, 50);
    </script>
</body>
</html>
