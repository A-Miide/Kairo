[package]
name = "kairo-server"
description = "Kairo's backend: the HTTP routes and WebSocket the UI talks to, speech engines, detection, outputs"
version.workspace = true
edition.workspace = true

[dependencies]
kairo-bible = { path = "../kairo-bible" }
kairo-detect = { path = "../kairo-detect" }
kairo-semantic = { path = "../kairo-semantic" }
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1.53.2", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "catch-panic"] }
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.3"
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1.1.10"
regex = "1.13.1"
sherpa-onnx = "1.13.8"
