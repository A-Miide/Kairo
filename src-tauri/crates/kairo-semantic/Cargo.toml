[package]
name = "kairo-semantic"
description = "Meaning-based verse search: ONNX embedder, quantized verse index, reranker"
version.workspace = true
edition.workspace = true

[dependencies]
kairo-bible = { path = "../kairo-bible" }
ort = "=2.0.0-rc.13"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ndarray = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Where ort can't use its own prebuilt ONNX Runtime (Windows: it's built for
# the DLL C runtime, the speech engine for the static one; Intel Macs: there
# is none; Linux: the speech engine's static library already carries one, and
# two copies don't link), ort links nothing (see /.cargo/config.toml) and uses the copy of
# ONNX Runtime 1.28.2 inside sherpa-onnx — linked here so every program
# that uses ort has it, not only the app.
[target.'cfg(any(all(windows, target_env = "msvc"), all(target_os = "macos", target_arch = "x86_64"), target_os = "linux"))'.dependencies]
sherpa-onnx-sys = "1.13.8"
