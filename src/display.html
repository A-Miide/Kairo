<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRO Display</title>
    <!-- Non-blocking preload-then-swap — see index.html for why. This is the
         projector/output window, so it matters even more here: a stuck render
         means a blank screen mid-service, not just a slow app launch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"></noscript>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Manrope', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            /* This is a live broadcast output, not a page to read — verse
               text (and everything else on it) shouldn't be selectable at
               all. #kairo-label already had this individually; applying it
               here covers the actual content too. */
            -webkit-user-select: none;
            user-select: none;
        }

        #stage {
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        /* Live video input (display_video.js): the bottom layer, under media,
           slide and timer, so scripture and slides draw over the picture. */
        #video-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        #video-layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* An empty video zone of a layout frame says so, inside the zone. */
        html.is-monitor body:not(.has-video) #video-layer[data-zone]::after { content: 'No video'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.4vh; font-weight: 600; letter-spacing: 0.04em; color: rgba(255,255,255,0.45); }
        /* Capture windows (NDI, Syphon, DeckLink, the stream) never show the 'No video' hint: the
           stream puts the camera there, and other outputs get the empty frame. */
        html.is-capture #video-layer[data-zone]::after { content: none; }
        /* On a Monitor the video is a dimmed backdrop for the confidence text. */
        body[data-mode="confidence"] #video-layer video { filter: brightness(0.4); }
        body[data-mode="confidence"].has-video #confidence-view { background: transparent; }

        /* News-ticker / large-scroll text layers (layer.scroll.enabled) — see
           buildLayerDOM below. Matches Theme Studio's own preview keyframe. */
        @keyframes kairo-marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-100%); }
        }

        /* Image Cycle's "Ken Burns" motion option (layer.motion — see
           startCycleMotion/renderImageCycleProps) — a slow, continuous
           zoom+pan on the image itself, alternating back and forth via
           the animation's own 'alternate' direction rather than a hard
           reset on every image swap. */
        @keyframes kairo-kenburns {
            from { transform: scale(1) translate(0, 0); }
            to   { transform: scale(1.12) translate(-2%, -2%); }
        }

        /* A text layer's one-time entrance (layer.entrance) — fade + rise
           when a slide/scene first shows, as opposed to Ken Burns above
           (continuous). Same keyframe app.js's canvas and service.js's
           preview also use, from styles.css — duplicated here since this
           file keeps its own separate stylesheet. */
        @keyframes kairo-text-in {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Independently-controlled layers, PP-style: media (image/video) sits
           behind, the slide (theme background/text) on top of it, and the
           timer layer on top of that. Each clears/updates without touching
           the others — a running stage timer never disturbs the scripture or
           lyrics on the slide layer, and Clear Timer removes only this one. */
        #media-layer, #slide-layer, #timer-layer {
            position: absolute;
            inset: 0;
        }
        #media-layer { z-index: 0; }
        /* A layout's frame (Director mode): the screen around the slide or verse. */
        #screen-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        #screen-layer:empty { display: none; }
        #slide-layer { z-index: 1; }
        #timer-layer { z-index: 2; pointer-events: none; }
        /* Overlays (logo, bug, lower-third picture) sit above everything. */
        #overlay-layer { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
        #overlay-layer .kairo-overlay { position: absolute; height: auto; transform: translate(-50%, -50%); transition: opacity 300ms ease; }
        #timer-layer:empty { display: none; }
        #media-layer video, #media-layer img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
        }

        /* Layer transitions */
        .display-layer {
            transition: opacity 350ms ease, transform 350ms ease;
        }

        /* A slide's layers blend with the layers under them (blend modes),
           never with the page or the media layer behind. */
        #slide-layer, #timer-layer { isolation: isolate; }

        /* Transparent background (no-bg look) */
        body.transparent-bg {
            background: transparent;
        }
        /* This output keyed for a video mixer (Settings → Outputs → Keying):
           no theme canvas is painted, so this shows behind the content —
           see-through, chroma green, or black for a luma key. */
        body[data-keying="alpha"] { background: transparent; }
        body[data-keying="chroma"] { background: #00ff00; }
        body[data-keying="luma"] { background: #000000; }

        /* KAIRO watermark */
        #kairo-label {
            position: fixed;
            bottom: 18px;
            right: 22px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
        }

        /* Connection status */
        #conn-status {
            position: fixed;
            top: 14px;
            left: 18px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 400ms ease;
            z-index: 9999;
        }

        #conn-status.visible { opacity: 1; }
        /* A monitor copy inside the operator window shows only the output itself. */
        .is-monitor #conn-status { display: none; }
        #conn-status.reconnecting { color: rgba(245, 158, 11, 0.6); }
        #conn-status.connected { color: rgba(255, 255, 255, 0.15); }

        /* Timer/clock — a real third layer alongside #slide-layer and
           #media-layer (see clear-layer handling below), just rendered as
           a small fixed corner readout rather than a full-stage layer.
           Two independent badges, not one shared slot — a segment
           countdown and the live clock can be relevant at the same time
           and shouldn't fight over the same element, overwriting each
           other every tick. Same visual register as #kairo-label/
           #conn-status (fixed, high z-index, low-emphasis). */
        #timer-badge, #clock-badge {
            position: fixed;
            right: 18px;
            font-family: var(--mono, monospace);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            z-index: 9999;
        }
        #timer-badge { top: 14px; }
        /* Clock sits below the timer when both are showing, rather than
           overlapping it. */
        #clock-badge { top: 72px; }
        #timer-badge.hidden, #clock-badge.hidden { display: none; }
        /* Overtime — past the segment's end time but still running until
           explicitly stopped, so it reads as "running long," not broken. */
        #timer-badge.is-overtime { color: #ed1c24; text-shadow: 0 1px 6px rgba(237,28,36,0.35); }
        #timer-badge.is-overtime .badge-label { color: rgba(237,28,36, 0.6); }
        /* Warning — inside the last minute, still counting down. A step
           between "normal" and "overtime" so the operator sees it coming
           rather than the color jumping straight from plain to red at 0. */
        #timer-badge.is-warning { color: #e8a64a; text-shadow: 0 1px 6px rgba(232,166,74,0.3); }
        #timer-badge.is-warning .badge-label { color: rgba(232, 166, 74, 0.6); }
        /* The themed on-stage timer layer keeps the THEME's own colour — a
           warning/overtime state is signalled with a glow + gentle pulse, not
           by overriding the operator's chosen colour. (The fixed corner badge
           above, which is unthemed, still recolours since it has no theme to
           respect.) */
        [data-binding="timer"].is-warning  { text-shadow: 0 0 14px rgba(232,166,74,0.55); }
        [data-binding="timer"].is-overtime { text-shadow: 0 0 16px rgba(237,28,36,0.6); animation: timer-otp 1s ease-in-out infinite; }
        @keyframes timer-otp { 50% { opacity: 0.55; } }
        /* What this output shows (outputModeMap in app_outputs.js). 'text'
           (Output Control → Text only): only the theme's words — no
           background, shapes, pictures or media (buildLayerDOM drops the
           rest). 'confidence': a Monitor output — the whole screen is the
           confidence monitor below, for whoever is up front. */
        body[data-mode="text"] #media-layer { display: none; }
        /* A message from the booth on an audience screen: a banner along the bottom, above everything. */
        #message-banner { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); z-index: 6; max-width: 84vw;
            padding: 1.6vh 3.2vh; border-radius: 1.4vh; background: rgba(12, 12, 16, 0.86); color: #fff;
            font: 600 3.4vh/1.3 Manrope, system-ui, sans-serif; text-align: center; box-shadow: 0 1vh 4vh rgba(0,0,0,0.45);
            border: 0.2vh solid rgba(255,255,255,0.12); transition: opacity 300ms ease, transform 300ms ease; pointer-events: none; }
        #message-banner[hidden] { display: block; opacity: 0; transform: translate(-50%, 2vh); }
        html.is-monitor #message-banner { display: none; }
        /* Words only means words only: no overlays (logos, badges) either. */
        body[data-mode="text"] #overlay-layer { display: none; }
        body[data-mode="confidence"] { background: #000 !important; }
        body[data-mode="confidence"] #stage,
        body[data-mode="confidence"] #overlay-layer,
        body[data-mode="confidence"] #timer-badge,
        body[data-mode="confidence"] #clock-badge,
        body[data-mode="confidence"] #kairo-label { display: none !important; }
        #confidence-view { display: none; }
        body[data-mode="confidence"] #confidence-view { display: flex; }
        /* A Monitor layout from Theme Studio instead of the built-in view. */
        #monitor-look { display: none; position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #000; }
        body[data-mode="confidence"].has-monitor-look #monitor-look { display: block; }
        body[data-mode="confidence"].has-monitor-look #confidence-view { display: none; }
        #monitor-look [data-binding="timer"].is-warning { color: #e8a64a !important; }
        #monitor-look [data-binding="timer"].is-overtime { color: #ed1c24 !important; }
        /* Multiview (Video director mode): the input grid full screen, read-only. */
        #multiview-view { display: none; }
        body[data-mode="multiview"] { background: #000 !important; }
        body[data-mode="multiview"] #stage, body[data-mode="multiview"] #video-layer, body[data-mode="multiview"] #overlay-layer,
        body[data-mode="multiview"] #timer-badge, body[data-mode="multiview"] #clock-badge,
        body[data-mode="multiview"] #kairo-label, body[data-mode="multiview"] #confidence-view { display: none !important; }
        body[data-mode="multiview"] #multiview-view { display: block; position: fixed; inset: 0; z-index: 1; padding: 2vh 2vw; background: #000; overflow: hidden; }
        #multiview-view { --border-md: rgba(255,255,255,0.14); --red: #ed1c24; --accent: #FF9130; --text: #f0f0f0; --text-2: #8e8e8e; --text-3: #6e6e6e; --selected-border: rgba(255,255,255,0.38); --radius-sm: 5px; --bg: #161618; }
        #multiview-view .vg { height: 100%; gap: 1.2vh 1.2vw; align-content: center; justify-content: stretch; }
        #multiview-view .vg-tile { width: 100%; height: auto; aspect-ratio: 16 / 9; border-width: 3px; cursor: default; }
        #multiview-view .vg-name { font-size: 2vh; padding: 3vh 1vw 1vh; }
        #multiview-view .vg-flag { font-size: 1.5vh; padding: 0.3vh 0.8vh; top: 1vh; left: 1vh; }
        #multiview-view .vg-empty-why, #multiview-view .vg-empty-mid { font-size: 1.8vh; }
        #confidence-view {
            position: fixed;
            inset: 0;
            z-index: 1;
            flex-direction: column;
            gap: 2.2vh;
            padding: 3.2vh 4vw 3.6vh;
            background: #000;
            color: #fff;
            font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        }
        .cv-top { flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 4vw; }
        .cv-clock, .cv-timer-value { font-size: 7.4vh; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
        .cv-timer { text-align: right; }
        .cv-timer[hidden] { display: none; }
        .cv-timer-label, .cv-next-head {
            display: block;
            font-size: 2.2vh;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
        }
        .cv-timer-label { margin-bottom: 0.9vh; }
        .cv-timer.is-warning .cv-timer-value { color: #e8a64a; }
        .cv-timer.is-overtime .cv-timer-value { color: #ed1c24; animation: timer-otp 1s ease-in-out infinite; }
        .cv-current {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 1.4vh;
            padding-top: 2.4vh;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
        }
        .cv-ref { flex: 0 0 auto; font-size: 3.4vh; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #f5b74e; }
        .cv-text { flex: 1 1 auto; min-height: 0; overflow: hidden; font-size: 9vh; font-weight: 600; line-height: 1.22; white-space: pre-line; }
        .cv-text.is-empty { color: rgba(255, 255, 255, 0.3); font-weight: 500; font-style: italic; }
        .cv-next { flex: 0 0 auto; padding-top: 1.8vh; border-top: 1px solid rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.62); }
        .cv-next[hidden] { display: none; }
        .cv-next-head { margin-bottom: 0.8vh; }
        .cv-next-head span { margin-left: 1.2vw; letter-spacing: 0.08em; color: rgba(245, 183, 78, 0.85); }
        .cv-next-text {
            font-size: 4vh;
            font-weight: 500;
            line-height: 1.3;
            white-space: pre-line;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* A message from the booth (Monitor message, under the preview) —
           its own band between now and next, so it covers neither; flashes
           as it arrives. */
        .cv-message {
            flex: 0 0 auto;
            margin: 0 -4vw;
            padding: 2vh 4vw;
            background: #ed1c24;
            color: #fff;
            font-size: 5.6vh;
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
        }
        .cv-message[hidden] { display: none; }
        .cv-message.is-new { animation: cv-flash 0.6s ease-in-out 4; }
        @keyframes cv-flash { 50% { opacity: 0.3; } }
        #timer-badge .badge-label, #clock-badge .badge-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            text-align: right;
        }
        /* Capture mode: the page is see-through where nothing is drawn, and the
       app snapshots it over black and over white to recover that
       transparency (src-tauri capture.rs) — for keying, NDI alpha and a video
       background the app plays itself (video_bg.rs), hidden here. */
    html.is-capture body { background: transparent; }
    html.is-capture[data-cap-bg="white"] { background: #fff; }
    .cap-under { visibility: hidden !important; }
</style>
</head>
<body>
    <div id="video-layer" aria-hidden="true"></div>
    <div id="stage">
        <div id="screen-layer"></div>
        <div id="media-layer"></div>
        <div id="slide-layer"></div>
        <div id="timer-layer"></div>
    </div>
    <!-- Overlays sit above everything, including the video zone: outside #stage, on top. -->
    <div id="overlay-layer"></div>
    <div id="message-banner" hidden aria-live="polite"></div>
    <div id="kairo-label">KAIRO</div>
    <div id="conn-status" class="visible reconnecting">Connecting…</div>
    <div id="timer-badge" class="hidden"></div>
    <div id="clock-badge" class="hidden"></div>
    <!-- A Monitor output: the confidence monitor (renderConfidenceView). -->
    <div id="multiview-view" aria-label="Multiview"></div>
    <div id="monitor-look" aria-label="Monitor"></div>
    <div id="confidence-view">
        <div class="cv-top">
            <div class="cv-clock" id="cv-clock"></div>
            <div class="cv-timer" id="cv-timer" hidden><span class="cv-timer-label" id="cv-timer-label"></span><span class="cv-timer-value" id="cv-timer-value"></span></div>
        </div>
        <div class="cv-current">
            <div class="cv-ref" id="cv-ref"></div>
            <div class="cv-text is-empty" id="cv-text">Nothing on screen</div>
        </div>
        <div class="cv-message" id="cv-message" hidden></div>
        <div class="cv-next" id="cv-next" hidden>
            <div class="cv-next-head">Next<span id="cv-next-ref"></span></div>
            <div class="cv-next-text" id="cv-next-text"></div>
        </div>
    </div>

    <script>
    // Capture mode (?capture=1, see "Capture mode" below): the hidden window
    // behind an NDI / Syphon output sits off-screen, where WebKit never fires
    // requestAnimationFrame — text fitting and the end of a change would never
    // run. Frames come from timers there instead, before any script uses them.
    if (new URLSearchParams(location.search).get('capture') === '1') {
        window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
        window.cancelAnimationFrame = (id) => clearTimeout(id);
    }
    </script>
    <script src="video_sim.js"></script>
    <script src="client_common.js"></script>
    <script>
    // An output window has no devtools: its uncaught errors go to the debug log
    // (databases/debug.log) instead of nowhere. Never shown on the screen itself.
    (function () {
        const out = (event, data) => { try { fetch(`${location.origin}/api/debug-log`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(window.kairoAuthToken && window.kairoAuthToken() ? { Authorization: `Bearer ${window.kairoAuthToken()}` } : {}) }, body: JSON.stringify({ event, data: { ...data, output: new URLSearchParams(location.search).get('output') || '' } }) }).catch(() => {}); } catch {} };
        window.addEventListener('error', (e) => out('display-js-error', { msg: String(e.message || '').slice(0, 300), src: String(e.filename || '').split('/').pop(), line: e.lineno }));
        window.addEventListener('unhandledrejection', (e) => out('display-js-rejection', { msg: String((e.reason && (e.reason.message || e.reason)) || '').slice(0, 300) }));
    })();
    </script>
    <script src="overlay_layer.js"></script>
    <script src="design_space.js"></script>
    <script src="word_split.js"></script>
    <script src="color_utils.js"></script>
    <script src="layer_geometry.js"></script>
    <script src="motion_graphics.js"></script>
    <script src="pp_render.js"></script>
    <script>
    'use strict';

    // ── URL params (legacy fallback) ───────────────────────────────────────
    const params      = new URLSearchParams(location.search);
    // A live copy of this output inside the operator's monitor (app.js): it
    // renders exactly what the real screen shows, but stays silent — no media
    // status reports, no audio, never touches the app window.
    // PREVIEW (video director mode): the staging screen. It draws through this
    // same page, but is fed by its parent window instead of the server socket.
    // SHARED: a copy inside the operator window that takes camera streams from
    // the parent's hub rather than opening the camera again.
    const PREVIEW     = params.get('preview') === '1';
    const SHARED      = PREVIEW || params.get('shared') === '1';
    const MONITOR     = params.get('monitor') === '1' || PREVIEW;
    // The hidden window behind an NDI / Syphon output (see "Capture mode" below).
    const CAPTURE     = params.get('capture') === '1';
    // A capture window feeding the live stream (src-tauri stream.rs): the camera is put under
    // its picture by FFmpeg, so where the camera shows it must be see-through.
    const STREAM_CAP  = CAPTURE && params.get('stream') === '1';
    if (MONITOR) document.documentElement.classList.add('is-monitor');
    if (CAPTURE) document.documentElement.classList.add('is-capture');
    function sendToServer(msg) { if (MONITOR) return; try { ws?.send(JSON.stringify(msg)); } catch {} }
    const legacyLayout  = params.get('layout') || 'fullscreen';
    const legacyOpacity = parseInt(params.get('opacity') || '80', 10) / 100;

    // ── State ──────────────────────────────────────────────────────────────
    // Derive WS URL from the page origin (Node sidecar serves this file, so
    // location.host is always correct — and matches whichever port Tauri
    // picked at launch).
    const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
    // Base delay for exponential backoff (see scheduleReconnect) — capped
    // low since this is a local sidecar process, not a remote network hop.
    const RECONNECT_BASE_DELAY = 1000;
    const RECONNECT_MAX_DELAY  = 8000;

    // Fetch the auth token from Tauri once at startup, then append it to the
    // WS URL. In a non-Tauri context the call no-ops and we connect unauthed
    // (server also treats auth as optional when its env var is absent).
    // AUTH_TOKEN / loadAuthToken / authedWsUrl / loadGoogleFont come from client_common.js.

    let ws             = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let currentVerseText = '';
    let currentVerseRef  = '';
    let currentTranslatedText = ''; // right-panel text for the Multi-Language theme
    let currentStyleByLayerId = {}; // per-slide, per-layer-id overrides (Full Edit) for whatever's currently shown
    let currentTimerText = ''; // last value sent for a 'timer'-bound layer — the per-second tick (handleActionBadge) updates the DOM directly and doesn't touch this
    let activeLook       = null;
    let pendingFade      = false;
    // Bumped by every renderStage/showVerse call that will paint (whether
    // immediately or after a fade-out setTimeout). renderStage/showVerse's
    // deferred callbacks capture the value at schedule time and bail if a
    // NEWER call has since bumped it — without this, two calls close
    // together (fast successive slide advances, e.g. the lyric follower)
    // could let the FIRST call's now-stale paint land after the second
    // call's own fade-out already started, flashing old content back in.
    let renderGen = 0;

    const stage      = document.getElementById('stage');
    const slideLayer = document.getElementById('slide-layer');
    const mediaLayer = document.getElementById('media-layer');
    const timerLayer = document.getElementById('timer-layer');
    const connStatus = document.getElementById('conn-status');

    // ── Media layer state (independent of the slide/text layer) ────────────
    let mediaMuted  = false;
    let mediaVolume = 1;
    let mediaSinkId = null;
    function currentMediaVideo() { return mediaLayer.querySelector('video'); }

    // ── Output-level slide transition (Fade/Slide/Cut + speed) ─────────────
    // Deliberately a DISPLAY setting now, not a per-theme one — every theme
    // used to carry its own look.animation/animationSpeed, which meant
    // "how slides transition" silently changed depending on which theme
    // happened to be live, with no single place to just set it for the
    // output once. No separate fetch needed to learn the initial value —
    // the server sends it as a WS snapshot the instant this window

    // ── Font loader ────────────────────────────────────────────────────────

    // hexToRgb/hexOpacity now come from color_utils.js, loaded via a <script>
    // tag above this one — shared with app.js/service.js, which had their own
    // slightly divergent copies of this same logic.

    // ── Free-canvas positioning ────────────────────────────────────────────
    // A layer may carry `pos: {x, y, w, h}` in 1920×1080 design-space pixels

    const DESIGN_W = window.KAIRO_DESIGN_W, DESIGN_H = window.KAIRO_DESIGN_H;

    // <script> tag above, resolved here via normal global scope since this

    }

    // ── Stream capture: tell the engine the camera and its place, and cut its window ──
    let streamReportTimer = null, lastStreamReport = '';
    function queueStreamReport() {
        if (!STREAM_CAP) return;
        clearTimeout(streamReportTimer);
        streamReportTimer = setTimeout(() => {
            const program = (outputLayers.video && readJson('kairo-video-live', {})[OUTPUT_KEY]) || null;
            const zone = program ? currentZone : null;
            updateStreamHole(program ? zone : null, !!program);
            const msg = JSON.stringify({ output: OUTPUT_KEY, program, zone });
            if (msg === lastStreamReport) return;
            lastStreamReport = msg;

    // Again every 2 s: the stream may have started after this window first said it (the
    // engine ignores a repeat that changes nothing).
    if (STREAM_CAP) setInterval(() => { lastStreamReport = ''; queueStreamReport(); }, 2000);
    // The camera's window: everything on #stage is cut away there (overlays stay on top).
    function updateStreamHole(zone, on) {
        const st = document.getElementById('stage');

        st.style.setProperty('-webkit-mask-composite', 'xor');
        st.style.setProperty('mask-composite', 'exclude');
    }

    // ── Layout frame (Director mode) ────────────────────────────────────────
    // A layout's screen theme is drawn around the slide or verse: its background, frames, logos
    // and the video zone go in #screen-layer, and the slide or verse is drawn as before, with its
    // own theme and branding, shrunk into the theme's content zone. If the screen theme styles
    // the verse text itself, it dictates the text instead and no content zone is used.
    let frameLook = null;
    let frameMode = false;      // the screen is drawn around a content card
    let frameDictates = false;  // the screen theme styles the text itself
    const screenLayerEl = document.getElementById('screen-layer');
    const frameHasText = (look) => (look.layers || []).some(l => (l.type === 'text' || l.type === 'pp') && l.visible !== false && l.binding === 'verse');

        if (!c || !c.pos) { resetContentBox(); return; }
        const vw = window.innerWidth, vh = window.innerHeight;
        const sx = vw / DESIGN_W, sy = vh / DESIGN_H;

        // never shows a frame: it carries the words only.
        const keyed = typeof outputKeying !== 'undefined' && outputKeying !== 'none';
        const want = outputMode === 'text' || keyed ? null : requestedFrame;
        const key = want ? JSON.stringify(want) : '';

        frameDictates = !!(frameLook && frameHasText(frameLook));

        const content = lastContentLook || assignedLook;

        }

                    wrap.style.height = (p.h / DESIGN_H * 100) + '%';
                    if (layer.rotation) wrap.style.transform = `rotate(${layer.rotation}deg)`;

                    div.style.inset  = '6% 4% auto auto';
                    div.style.width  = '38%';
                    div.style.height = '24%';
                    div.style.borderRadius = '10px';
                    div.style.overflow = 'hidden';
                } else if (layout === 'side-rail') {
                    // Full-height left rail
                    div.style.inset  = '0 auto 0 0';
                    div.style.width  = '32%';
                } else if (layout === 'split-left') {
                    // Full-height left half — verse panel, right half left clean
                    div.style.inset  = '0 auto 0 0';
                    div.style.width  = '50%';
                } else if (layout === 'split-right') {
                    // Full-height right half — verse panel, left half left clean
                    div.style.inset  = '0 0 0 auto';
                    div.style.width  = '50%';
                }

                // Free-canvas override (shapes / repositioned backgrounds).
                // Positioned shapes sit above the base background but below
                // text, interleaving with images by layer order.
                if (layer.pos) {
                    applyPos(div, layer.pos);
                    div.style.height  = (layer.pos.h / DESIGN_H * 100) + '%';
                    div.style.zIndex  = '1';
                    applyShapeGeometry(div, layer, shapeRadiusVh);
                    if (layer.rotation) div.style.transform = `rotate(${layer.rotation}deg)`;
                }

                frag.appendChild(div);
                return;
            }

            if (layer.type === 'text') {
                // Per-slide override for this specific layer (by its stable
                // theme-defined id) — see buildLayerDOM's own comment.
                const ov = (styleByLayerId || {})[layer.id] || {};
                if (ov.visible === false) return;

                // Pick content for this layer
                let content = '';
                // A Custom layer whose text contains the literal "{timer}"
                // placeholder gets that substituted with the live countdown
                // on every tick (handleActionBadge) — this is what actually
                // weaves the number INTO a sentence ("Worship begins in
                // {timer}") instead of it only ever being its own separate
                // element next to the copy. hasTimerTemplate flags which
                // ones need that per-tick substitution below.
                const hasTimerTemplate = layer.binding === 'custom' && typeof layer.customText === 'string' && layer.customText.includes('{timer}');
                if (layer.binding === 'verse')     content = verseText;
                else if (layer.binding === 'verse_translated') content = translatedText || '';
                else if (layer.binding === 'reference') content = verseRef;
                else if (layer.binding === 'timer') content = timerText || '';
                // Individual hour/minute/second parts (see timeParts,
                // handleActionBadge) — no live remainingMs at initial-paint
                // time, only once the first per-second tick lands right
                // after, so this is just a zeroed placeholder either way.
                else if (layer.binding === 'timer-h' || layer.binding === 'timer-m' || layer.binding === 'timer-s') content = '00';
                else if (hasTimerTemplate) content = layer.customText.replace('{timer}', timerText || '0:00');
                else if (isMonitorBinding(layer.binding)) content = monitorBindingText(layer.binding);
                else content = layer.customText || '';

                const div = document.createElement('div');
                div.className = 'display-layer';
                div.dataset.binding = layer.binding || 'custom';
                div.dataset.layerId = layer.id || '';
                if (layer.follows) div.dataset.follows = layer.follows; // see stackFollowers (layer_geometry.js)
                if (hasTimerTemplate) div.dataset.timerTemplate = layer.customText;
                div.dataset.layerId = layer.id || '';

                // Field-by-field merges — a partial override (just font.size,
                // say) must not blow away the rest of the theme's settings.
                const fs = { ...layer.font, ...(ov.font || {}) };
                const shadow = ov.shadow ? { ...layer.shadow, ...ov.shadow } : layer.shadow;
                const outline = ov.outline ? { ...layer.outline, ...ov.outline } : layer.outline;
                const color = ov.color || layer.color;
                const opacity = ov.opacity ?? layer.opacity;
                const align = ov.align || layer.align;
                // Outline is folded into this SAME text-shadow (as a ring of
                // sharp offset shadows via outlineShadows — see
                // layer_geometry.js) rather than -webkit-text-stroke, which
                // this WebKit build corrupts on bold/large text — see that
                // helper's own comment.
                const shadowParts = [];
                if (outline && outline.enabled) shadowParts.push(...outlineShadows(outline.width, outline.color));
                if (shadow.enabled) shadowParts.push(`${shadow.x}px ${shadow.y}px ${shadow.blur}px ${hexOpacity(shadow.color, shadow.opacity)}`);
                const shadowStr = shadowParts.length ? shadowParts.join(', ') : 'none';

                // A reference/translation caption with no verse line to
                // caption reads as orphaned floating text (e.g. just a song
                // title on an otherwise empty canvas) rather than theme-
                // controlled output — withhold it, same rule paintLookLayers
                // (service.js) applies for every preview. The div still gets
                // created (data-binding intact) so showVerse's in-place
                // update path below can reveal/re-hide it as verseText
                // changes, without a full rebuild every slide.
                const isCaptionOfVerse = hasVerseLayer && (layer.binding === 'reference' || layer.binding === 'verse_translated');
                // A per-item override (ov.color) is this slide's own solid
                // colour — it wins over the theme's gradient, same as it
                // already wins over the theme's plain colour.
                const colorCss = (layer.colorFill === 'gradient' && !ov.color)
                    ? `background: ${gradientCss(layer, c => hexOpacity(c, opacity))}; -webkit-background-clip: text; background-clip: text; color: transparent;`
                    : `color: ${hexOpacity(color, opacity)};`;

                div.style.cssText = `
                    position: absolute;
                    display: ${isCaptionOfVerse && !String(verseText || '').trim() ? 'none' : 'flex'};
                    flex-direction: column;
                    justify-content: center;
                    ${colorCss}
                    font-family: '${fs.family}', system-ui, sans-serif;
                    font-size: ${fs.size}px;
                    font-weight: ${fs.weight};
                    font-style: ${fs.italic ? 'italic' : 'normal'};
                    line-height: ${fs.lineHeight};
                    letter-spacing: ${fs.letterSpacing}px;
                    text-transform: ${fs.transform};
                    text-align: ${align};
                    text-shadow: ${shadowStr};
                    z-index: 10;
                `;

                // Line breaks typed into a custom text layer are meant — the
                // operator's preview (.svc-canvas-text) always kept them.
                if (layer.binding === 'custom') div.style.whiteSpace = 'pre-line';

                // Timer state colours travel on the element so the per-second
                // 'action' tick (handleActionBadge) can recolour it as the
                // countdown enters warning / overtime — the theme owns all
                // three colours; these are just the classic defaults.
                if (layer.binding === 'timer' || layer.binding === 'timer-h' || layer.binding === 'timer-m' || layer.binding === 'timer-s') {
                    div.dataset.baseColor     = hexOpacity(color, opacity);
                    // At the layer's own opacity, so a countdown faded back
                    // behind the copy stays faded as it turns amber/red.
                    div.dataset.warnColor     = hexOpacity(ov.warnColor     || layer.warnColor     || '#e8a64a', opacity);
                    div.dataset.overtimeColor = hexOpacity(ov.overtimeColor || layer.overtimeColor || '#ed1c24', opacity);
                }

                // Positioning by layout
                if (layout === 'fullscreen') {
                    div.style.left  = '0';
                    div.style.right = '0';
                    div.style.padding = '0 8%';
                    if (layer.binding === 'verse') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-65%)';
                        div.style.maxWidth  = '100%';
                    } else if (layer.binding === 'reference') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(40%)';
                    } else if (layer.binding === 'timer') {
                        div.style.left = 'auto'; div.style.right = '4%'; div.style.top = '5%';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-50%)';
                    }
                } else if (layout === 'lower-third') {
                    div.style.left    = '0';
                    div.style.right   = '0';
                    div.style.padding = '0 6%';
                    if (layer.binding === 'verse') {
                        div.style.bottom = '14%';
                    } else if (layer.binding === 'reference') {
                        div.style.bottom = '5%';
                    } else if (layer.binding === 'timer') {
                        div.style.left = 'auto'; div.style.right = '4%'; div.style.bottom = 'auto'; div.style.top = '5%';
                    } else {
                        div.style.bottom = '10%';
                    }
                } else if (layout === 'ticker') {
                    div.style.left    = '0';
                    div.style.right   = '0';
                    div.style.bottom  = '3%';
                    div.style.padding = '0 3%';
                    div.style.whiteSpace    = 'nowrap';
                    div.style.overflow      = 'hidden';
                    div.style.textOverflow  = 'ellipsis';
                } else if (layout === 'scroll-fill') {
                    // Large scrolling text filling the whole screen — same
                    // marquee mechanism as the ticker above, just a full-height
                    // band instead of a thin strip at the bottom.
                    div.style.left    = '0';
                    div.style.right   = '0';
                    div.style.top     = '0';
                    div.style.bottom  = '0';
                    // Must NOT unconditionally force 'flex' here — that stomps
                    // the "no caption without a verse line" display:none the
                    // cssText block above just set for a reference/translated
                    // layer with no verse text, undoing that guard for any
                    // theme using this layout.
                    if (div.style.display !== 'none') div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.whiteSpace = 'nowrap';
                    div.style.overflow   = 'hidden';
                    div.style.padding    = '0';
                } else if (layout === 'lower-third-card') {
                    // Text positioned inside the bottom-left card (matches bg insets)
                    div.style.left    = '4%';
                    div.style.width   = '64%';
                    div.style.padding = '0 3%';
                    if (layer.binding === 'verse') {
                        div.style.bottom = '14%';
                    } else if (layer.binding === 'reference') {
                        div.style.bottom = '32%';
                    } else {
                        div.style.bottom = '20%';
                    }
                } else if (layout === 'corner-card') {
                    // Text inside the upper-right compact card
                    div.style.right   = '4%';
                    div.style.width   = '38%';
                    div.style.padding = '0 3%';
                    if (layer.binding === 'reference') {
                        div.style.top = '8%';
                    } else if (layer.binding === 'verse') {
                        div.style.top = '15%';
                    } else {
                        div.style.top = '11%';
                    }
                } else if (layout === 'side-rail') {
                    // Text centered vertically inside the left rail
                    div.style.left    = '0';
                    div.style.width   = '32%';
                    div.style.padding = '0 3%';
                    if (layer.binding === 'verse') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-40%)';
                    } else if (layer.binding === 'reference') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(60%)';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-50%)';
                    }
                } else if (layout === 'multi-language') {
                    // Both languages share one frame, so — unlike plain
                    // split-left/right — which half a layer belongs to comes
                    // from its binding/id, not the layout as a whole.
                    // 'verse'/'ref' -> left; 'verse_translated'/'ref-translated' -> right.
                    const isRight = layer.binding === 'verse_translated' || layer.id === 'ref-translated';
                    div.style.width   = '50%';
                    div.style.padding = '0 4%';
                    if (isRight) div.style.right = '0'; else div.style.left = '0';
                    if (layer.binding === 'verse' || layer.binding === 'verse_translated') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-58%)';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(120%)';
                    }
                } else if (layout === 'split-left' || layout === 'split-right') {
                    // Text centered vertically inside the active half. Split-left
                    // pins the text column to the left edge; split-right to the right.
                    div.style.width   = '50%';
                    div.style.padding = '0 4%';
                    if (layout === 'split-left') div.style.left = '0'; else div.style.right = '0';
                    if (layer.binding === 'verse') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-58%)';
                    } else if (layer.binding === 'reference') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(120%)';
                    } else if (layer.binding === 'timer') {
                        div.style.top = '5%';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-50%)';
                    }
                }

                // Free-canvas override: explicit box wins over every layout rule.
                // A per-slide override box (ov.pos) wins over the theme's own —
                // it can also introduce free-canvas positioning for a layer that
                // otherwise only ever used a layout preset.
                const effectivePos = ov.pos || layer.pos;
                if (effectivePos) {
                    applyPos(div, effectivePos);
                    // Turned about its own centre (a countdown running up the
                    // edge of the screen, say).
                    div.style.transform = layer.rotation ? `rotate(${layer.rotation}deg)` : 'none';
                    div.style.padding   = '0';
                    // Entrance (layer.entrance, renderTextProps' Effects
                    // tab) — only safe for a free-positioned layer, since a
                    // layout preset elsewhere may already be using
                    // `transform` for its own centering and this would
                    // replace, not compose with, that. transform is always
                    // reset to 'none' right above when there's an explicit
                    // pos, so nothing to conflict with here.
                    if (layer.entrance === 'fade-up') div.style.animation = 'kairo-text-in 700ms ease-out both';
                }

                // Remember the designed size (already override-aware via `fs`
                // above) so auto-fit always shrinks from the intended size,
                // never from a previously-shrunk value. Also stash the
                // effective box so fitTextLayer's shrink budget matches
                // whatever box is actually rendered, override or not.
                div.dataset.baseSize = fs.size;
                if (effectivePos) div.dataset.effPos = JSON.stringify(effectivePos);
                else delete div.dataset.effPos;

                // Marquee scroll (news-ticker / large-scroll layers) — same
                // technique as Theme Studio's own preview (see renderPreview
                // in app.js): an inner span pushed off the right edge and
                // animated to -100%, so it crosses the whole band and loops
                // without needing to measure the text's actual width.
                if (layer.scroll?.enabled) {
                    div.style.whiteSpace   = 'nowrap';
                    div.style.overflow     = 'hidden';
                    div.style.textOverflow = 'clip';
                    const span = document.createElement('span');
                    span.style.display = 'inline-block';
                    span.style.paddingLeft = '100%';
                    span.style.animation = `kairo-marquee ${Math.max(1, layer.scroll.speed || 15)}s linear infinite`;
                    span.textContent = content;
                    div.appendChild(span);
                } else if (layer.binding === 'verse' && window.KairoWordSplit?.applyMotionText(div, look?.textAnimation, content, look?.textAnimationSpeed || 1, { color: look?.textHighlightColor, intensity: look?.textAnimationIntensity })) {
                    // handled
                } else if (hasAccentMarkup(content, layer.accentColor)) {
                    // "*word*" in the accent colour — a two-tone headline in one layer.
                    div.innerHTML = accentHtml(content, layer.accentColor);
                } else {
                    div.textContent = content;
                }
                frag.appendChild(div);

                // Ensure font is loaded
                if (fs.family !== 'system-ui') loadGoogleFont(fs.family);
            }
        };
        // Each layer's build-in (new content only) and its idle motion — the
        // stage fills this window, so 1vh is one percent of the output.
        layers.forEach(layer => {
            const before = frag.childNodes.length;
            paintLayer(layer);
            for (let i = before; i < frag.childNodes.length; i++) applyBlendMode(frag.childNodes[i], layer, (styleByLayerId || {})[layer.id]);
            if (!window.KairoMotion) return;
            const anim = animOf(layer);
            for (let i = before; i < frag.childNodes.length; i++) window.KairoMotion.animateLayer(frag.childNodes[i], anim, { builds: !!opts.builds, unit: '1vh' });
        });

        if (!frameMode && opts.zone) applyVideoZone(zoneLayer);
        return { frag, isTransparent };
    }

    // ── Auto-fit long verses ───────────────────────────────────────────────
    // Scripture verse length varies enormously — from "Jesus wept" (2 words) to
    // Esther 8:9 (~90 words, the longest verse in the Bible). A fixed font size
    // that looks right for a short verse overflows the stage on a long one,
    // especially inside a half-width split panel. After each render we measure
    // the verse element and shrink its font size (never grow past the theme's
    // designed size) until it fits the vertical space its layout allows.
    function fitVerse() {
        fitTextLayer('verse');
        fitTextLayer('verse_translated');
        // A reference following its verse is placed once the verse has its size.
        stackFollowers(stage);
    }

    function fitTextLayer(binding) {
        const el = stage.querySelector(`[data-binding="${binding}"]`);
        if (!el) return;
        const layout = (activeLook || FALLBACK_LOOK).layout || 'fullscreen';
        const stageH = stage.clientHeight || window.innerHeight || 0;

        // Not laid out yet (0-size stage during load / detached window). Shrinking
        // against a bogus size would collapse the text to the floor — bail and let
        // the next render or the resize handler fit it once dimensions are real.
        if (stageH < 50 || stage.clientWidth < 50) return;

        // Free-canvas verse box: the budget is its own box height when set, or
        // the space from its top edge to the bottom of the stage when auto.
        // Read the EFFECTIVE box stashed on the element itself (buildLayerDOM's
        // `dataset.effPos`), not the theme's raw layer.pos — a per-slide
        // override can supply/replace this box entirely, and the shrink
        // budget must match whatever box is actually rendered.
        const p = el.dataset.effPos ? JSON.parse(el.dataset.effPos) : null;
        if (p) {
            const maxHpx = p.h > 0
                ? stageH * (p.h / 1080)
                : stageH * Math.max(0.08, 1 - p.y / 1080);
            const base = parseFloat(el.dataset.baseSize) || parseFloat(el.style.fontSize) || 48;
            let size = base;
            el.style.fontSize = size + 'px';
            // Measure unconstrained — a fixed-height box always reports
            // scrollHeight >= its height, which would shrink text to nothing.
            const prevH = el.style.height;
            el.style.height = 'auto';
            let guard = 60;
            while (el.scrollHeight > maxHpx && size > 14 && guard-- > 0) {
                size = Math.floor(size * 0.94);
                el.style.fontSize = size + 'px';
            }
            el.style.height = prevH;
            return;
        }

        // Fraction of stage height the verse is allowed to occupy per layout.
        const FRAC = {
            'lower-third': 0.30, 'lower-third-card': 0.24, 'corner-card': 0.20,
            'ticker': 0.16, 'side-rail': 0.80, 'split-left': 0.84, 'split-right': 0.84,
            'multi-language': 0.84,
        };
        const maxH = stageH * (FRAC[layout] || 0.72);

        const base = parseFloat(el.dataset.baseSize) || parseFloat(el.style.fontSize) || 48;
        let size = base;
        el.style.fontSize = size + 'px';

        // Shrink in ~6% steps until it fits or hits a legibility floor.
        let guard = 60;
        while (el.scrollHeight > maxH && size > 14 && guard-- > 0) {
            size = Math.floor(size * 0.94);
            el.style.fontSize = size + 'px';
        }
    }

    // ── Default fallback look (used if no look stored yet) ─────────────────
    const FALLBACK_LOOK = {
        id: 'default', name: 'Default', layout: 'fullscreen', animation: 'fade',
        layers: [
            { id: 'bg', type: 'background', name: 'Background', visible: true,
              fill: 'solid', color: '#000000', opacity: 100, color2: '#1a1a2e', angle: 160 },
            { id: 'verse', type: 'text', name: 'Verse Text', visible: true,
              binding: 'verse', customText: '',
              font: { family: 'Manrope', size: 56, weight: 500, italic: false, lineHeight: 1.35, letterSpacing: 0, transform: 'none' },
              color: '#ffffff', opacity: 100, align: 'center',
              shadow: { enabled: true, color: '#000000', opacity: 70, blur: 24, x: 0, y: 4 },
              outline: { enabled: false, color: '#000000', width: 2 } },
            { id: 'ref', type: 'text', name: 'Reference', visible: true,
              binding: 'reference', customText: '',
              font: { family: 'Manrope', size: 24, weight: 600, italic: false, lineHeight: 1.2, letterSpacing: 3, transform: 'uppercase' },
              color: '#ffffff', opacity: 55, align: 'center',
              shadow: { enabled: false, color: '#000000', opacity: 70, blur: 4, x: 0, y: 1 },
              outline: { enabled: false, color: '#000000', width: 1 } },
        ],
    };

    // ── Which output is this window? ───────────────────────────────────────
    // Each destination can be assigned its own theme in Settings (the
    // ProPresenter stage-vs-audience model). A display window declares which
    // output it represents via ?output=…; the default is the external display.
    const OUTPUT_KEY = (new URLSearchParams(location.search).get('output') || 'external').toLowerCase();

    // ── What this output shows: its theme, only its words, or the Monitor view ──
    // app_outputs.js outputModeMap: a Monitor output → 'confidence', a display
    // with Output Control → Text only → 'text', else 'theme'. Delivered the
    // same two ways as keying: localStorage + a look-update broadcast.
    const OUTPUT_MODES = ['theme', 'text', 'confidence', 'multiview'];
    function loadOutputMode() {
        try {
            const map = JSON.parse(localStorage.getItem('kairo-output-modes') || 'null');
            if (map && OUTPUT_MODES.includes(map[OUTPUT_KEY])) return map[OUTPUT_KEY];
        } catch {}
        return 'theme';
    }
    let outputMode = loadOutputMode();
    document.body.dataset.mode = outputMode;

    // ── Load this output's look from localStorage ──────────────────────────
    function loadActiveLook() {
        try {
            const map = JSON.parse(localStorage.getItem('kairo-output-themes') || 'null');
            if (map && map[OUTPUT_KEY]) return map[OUTPUT_KEY];
        } catch {}
        try {
            const stored = localStorage.getItem('kairo-active-look');
            return stored ? JSON.parse(stored) : null;
        } catch { return null; }
    }

    // Pick this output's theme out of a broadcast payload.
    function pickLook(payload) {
        if (payload && payload.themes && payload.themes[OUTPUT_KEY]) return payload.themes[OUTPUT_KEY];
        return payload && payload.look ? payload.look : null;
    }

    // ── Output Looks: this output's Slide/Media/Timer visibility ───────────
    // Same dual-delivery pattern as the theme map above (localStorage +
    // 'storage' event for instant same-origin propagation, plus a WS
    // look-update broadcast as the belt-and-suspenders path) — see
    // applyOutputLayers/outputLayerMap in app.js. Defaults ALL FOUR true
    // when nothing is configured for this output (or nothing at all has
    // ever been pushed yet), matching outputLayerMap's own zero-config-safe
    // default — a fresh install/window behaves exactly like before this
    // feature existed.
    const DEFAULT_LAYERS = { bible: true, slide: true, media: true, timer: true, overlay: true, message: true, video: false };
    let outputLayers = DEFAULT_LAYERS;
    // Which of Bible/Slide the CURRENTLY shown slide-layer content actually
    // is — set by handleMessage whenever it renders through showVerse/
    // renderImageStage below, read by applyOutputLayers so turning off
    // "Slide" doesn't blank a Bible verse that's currently on screen (and
    // vice versa).
    let currentSlideIsBible = false;

    // Live video input under this output's layers (display_video.js). The
    // sources and which one is live come from the main window the same way
    // the layer map does: localStorage + the 'storage' event.
    let videoLayer = null;
    let videoOn = false;     // a source's picture is showing on this output
    function readJson(key, fallback) {
        try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch { return fallback; }
    }
    // Video code is loaded only when a source is actually live here, so an
    // output that never uses video never starts any of it.
    let previewSourceId = null;      // PREVIEW: the staged source, from the parent
    let previewVideoOn = true;       // PREVIEW: whether the loaded Look carries the video layer
    let videoModulesPromise = null;
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
    }
    function ensureVideoModules() {
        if (!videoModulesPromise) {
            videoModulesPromise = loadScript('video_sources.js').then(() => loadScript('display_video.js'));
        }
        return videoModulesPromise;
    }
    function videoProvider() {
        // A copy inside the operator window uses the parent's one capture per device.
        try { return SHARED && window.parent !== window ? window.parent.KairoVideoHub : null; } catch { return null; }
    }
    // Multiview (Video director mode): this display shows the input grid, read-only.
    // Copies inside the operator window and capture windows never open the cameras.
    function startMultiview() {
        if (CAPTURE || MONITOR || PREVIEW) return;
        if (videoLayer) { try { videoLayer.dispose(); } catch {} videoLayer = null; videoOn = false; document.body.classList.remove('has-video'); }
        if (!document.getElementById('mv-css')) { const l = document.createElement('link'); l.id = 'mv-css'; l.rel = 'stylesheet'; l.href = 'video_director.css'; document.head.appendChild(l); }
        loadScript('display_multiview.js').then(() => window.KairoDisplayMultiview.start(document.getElementById('multiview-view'), loadScript)).catch(() => {});
    }
    function stopMultiview() {

    }
    async function syncVideo() {

    }
    // The director's T-bar: a source fades in over what is showing, by hand.

        if (!v || typeof v.t !== 'number') return;

    }
    function createVideoLayer() {

            // The director's cut or fade, else this output's own transition.

    function loadOutputLayers() {

            const map = JSON.parse(localStorage.getItem('kairo-output-layers') || 'null');
            if (map && map[OUTPUT_KEY]) return { ...DEFAULT_LAYERS, ...map[OUTPUT_KEY] };
        } catch {}
        return DEFAULT_LAYERS;
    }

    // ── Keying: how this output's background keys out for a mixer ─────────
    // 'none' | 'alpha' | 'chroma' | 'luma' — the output's own choice, not the
    // theme's, so one theme serves the projector and the stream overlay alike.
    // Same dual delivery as the layers above (localStorage + look-update).
    const KEYINGS = ['none', 'alpha', 'chroma', 'luma'];
    let outputKeying = loadOutputKeying();
    document.body.dataset.keying = outputKeying;
    function loadOutputKeying() {
        try {
            const map = JSON.parse(localStorage.getItem('kairo-output-keying') || 'null');

        } catch {}

    }

        }
        return null;
    }

    // Applying a new layer map means some layer may have just turned OFF —
    // actively clear that layer's current content rather than merely
    // skipping future updates for it, reusing the exact same clear paths
    // 'clear-layer' already uses for a manual Clear Slide/Media/Timer click.
    // Called on load, on every 'storage' event, and on every 'look-update'
    // broadcast — all three are real, independent ways this value changes.
    function applyOutputLayers(next) {
        const prev = outputLayers;
        outputLayers = next;
        if (!!prev.video !== !!next.video) syncVideo();
        // Only actually blank the slide layer if the layer that just turned
        // off is the one the CURRENTLY showing content belongs to — turning
        // off Slide shouldn't blank a Bible verse that's on screen, and
        // turning off Bible shouldn't blank an announcement slide.
        if ((currentSlideIsBible ? (prev.bible && !next.bible) : (prev.slide && !next.slide))) { clearDisplay(); noteConfidenceSlide(null); }
        if (prev.media && !next.media) renderMediaStage(null);
        if (prev.overlay !== next.overlay) drawOverlays();
        if (prev.message !== next.message) drawMessageBanner();

            updateConfidenceTimer({ cleared: true });

            clockBadgeEl?.classList.add('hidden');
            if (timerLayer) timerLayer.innerHTML = '';

            activeSceneIndex = -1;
            activeSceneSlot = -1;
        }
    }

    // Overlays (Settings → Overlays) follow this output's own Overlays layer.

    function drawOverlays() {

    }

    // The theme configured for this output in Settings. Content-level overrides
    // (a playlist item's own theme) are temporary and revert to this.
    let assignedLook = null;

    let lastContentLook = null;   // a playlist item's own theme, while its content is on screen
    function applyContentLook(look) {
        lastContentLook = look || null;
        // A layout that styles the text itself dictates it; otherwise the slide or verse keeps its own theme.
        const base = frameBaseLook();
        if (look && !frameDictates) {
            if (activeLook !== look) applyLook(look, false);
        } else if (base && activeLook !== base) {
            applyLook(base, false);
        }
    }

    // ── Render the slide layer with current look + text ─────────────────────
    // Targets #slide-layer specifically, not the whole #stage — the media
    // layer behind it (an independently-sent image/video) must not fade or
    // clear just because the slide's text changed.
    function renderStage(verseText, verseRef, animate = true, translatedText = '', styleByLayerId = {}, timerText = '') {
        const myGen = ++renderGen;
        const look = activeLook || FALLBACK_LOOK;

        const doRender = () => {
            slideLayer.innerHTML = '';
            document.body.classList.remove('transparent-bg');

            // Nothing to actually show — leave the slide layer empty rather
            // than painting the theme's own background over the media layer
            // sitting behind it. Centralized here (not just in clearDisplay)
            // because applyLook() also calls this on every 'look-update'
            // broadcast (which fires on every Theme Studio autosave, i.e.
            // constantly while editing a theme) — clearing at boot alone
            // wasn't enough, since the very next look-update repainted the
            // "empty" background right back in, silently undoing it and
            // burying whatever media had been sent in the meantime.
            // A timer segment has no verse/reference at all, only timerText
            // — must NOT be treated as "nothing to show" just because those
            // two are blank.
            if (!verseText && !verseRef && !timerText && !hasVideoZone(look)) { if (!frameMode) applyVideoZone(null); fitVerse(); return; }

            const { frag, isTransparent } = buildLayerDOM(look, verseText, verseRef, translatedText, styleByLayerId, timerText, false, { builds: animate, zone: true });
            if (isTransparent) document.body.classList.add('transparent-bg');
            slideLayer.appendChild(frag);
            fitVerse();
        };

        // outputAnimation/outputAnimationSpeed ('fade'/'slide-up'/'cut' + a
        // multiplier on the original fixed 300ms, <1 faster, >1 slower) —
        // a display-level setting now (see its own comment near the top of
        // this file), not read off the theme anymore: how slides transition
        // used to silently change depending on which theme happened to be
        // live, with no one place to just set it for the output.
        const animType = outputAnimation;
        const speedMs = Math.round(300 * outputAnimationSpeed);

        // 'cut' skips this whole-slide-layer fade/slide choreography
        // entirely (and the synchronous offsetHeight forced-reflow below).
        // Text Animation (Word/Activate/Karaoke/etc, a separate per-theme
        // setting from this Transition — see KairoWordSplit's file header)
        // runs independently inside buildLayerDOM regardless of what
        // happens here; Fade/Slide + a Text Animation is a valid,
        // deliberate combination, not redundant.

            doRender();
        } else if (animate) {
            // Fade (+ slide, for 'slide-up') out → swap → fade (+ slide) in.
            // Reuses one shared element/transition for both halves — same
            // trick that made the plain opacity fade work without any extra
            // reflow step, now covering slide-up's transform too.
            const outY = animType === 'slide-up' ? '-16px' : '0px';
            slideLayer.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`;
            slideLayer.style.opacity    = '0';
            slideLayer.style.transform  = animType === 'slide-up' ? `translateY(${outY})` : 'none';

            setTimeout(() => {
                if (myGen !== renderGen) return; // superseded by a newer render — don't paint stale content
                doRender();
                if (animType === 'slide-up') {
                    // Land the new content NOT quite in place first (no
                    // transition yet, so this doesn't itself animate) —
                    // needs a real reflow before the transition below can
                    // actually play, unlike the opacity-only case which
                    // already had one from this same setTimeout gap.
                    slideLayer.style.transition = 'none';
                    slideLayer.style.transform  = 'translateY(16px)';
                    slideLayer.offsetHeight; // force layout
                    slideLayer.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`;
                    slideLayer.style.transform  = 'none';
                }

        } else {
            doRender();
        }
    }

    // ── Timer layer: the timer theme's OWN independent layer ──────────────
    // Renders the segment's full theme (background included) exactly as the
    // Edit view shows it — but on its own layer, NOT #slide-layer. So:
    //  • whether it overlays or covers the slide is the THEME's choice (a
    //    transparent/lower-third timer theme overlays; a full-bleed one
    //    covers) — not something forced here;
    //  • Clear Timer removes just this, and the scripture/lyrics on the
    //    slide layer are still there underneath, no re-send needed.
    // The per-second value arrives via the 'action' broadcast
    // (handleActionBadge writes into [data-binding="timer"], which lives in
    // this layer). renderTimerLayer runs once, at segment start.
    // opts.builds: play each layer's build-in (a segment starting, a scene
    // arriving). opts.transition 'blur'/'fade': hand over from what's showing
    // through a crossfade rather than a cut — the outgoing scene is lifted
    // into its own copy on top that blurs/fades away while the new scene's
    // pieces build in underneath it.
    function renderTimerLayer(look, styleByLayerId, timerText, opts = {}) {
        lastTimerLayerArgs = look ? [look, styleByLayerId, timerText] : null;
        const leaving = opts.transition && opts.transition !== 'cut' && timerLayer.childNodes.length
            ? liftForCrossfade(timerLayer, opts.transition) : null;

        timerLayer.classList.remove('transparent');
        if (!look) return;

            ? [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(18px)' }]

    }

    // ── Scene storyboard (segment.scenes — see segments.js) ────────────────
    // A segment can carry a SEQUENCE of scenes instead of one theme, each
    // with its own explicit duration and its own complete layer set (own
    // background/image-cycle/text — a real per-scene layout and caption,
    // not just a swapped image). Played in order across the live
    // countdown: scene 0 from t=0, scene 1 once scene 0's duration is up,
    // and so on: the LAST scene just keeps showing (looping its own
    // images) for any time left over once every scene's duration is
    // accounted for, rather than erroring if they don't add up to the
    // segment's actual countdown length.
    let timerScenes = null;      // [{id, name, durationSec, layers}] | null

    // share the time, loop on a long countdown, and a finale can hold the
    // last minute. null for a segment saved before pacing existed.
    let timerScenePace = null;
    let activeSceneSlot = -1;    // which showing: a scene coming round again is a new one

    // the SAME independent media layer/slot Media Bin sends use
    // (renderMediaStage — see msg.type === 'media' above), not a second,
    // scene-private image baked into the timer layer on top of it. Two

    // #media-layer on purpose (z-index 2 vs 0 — see the comment by their

    // OWN opaque image in that same top layer defeated that and made
    // "send a video from the Media Bin while a scene is live" always
    // render blank — the scene's art was covering it. (2) it makes the two
    // features genuinely the same mechanism: an operator sending a Media
    // Bin item while a scene is live now just swaps what's on that shared
    // backdrop slot, with the scene's own copy/countdown still layered on
    // top exactly as designed, instead of two competing, inconsistent
    // paths for "what's the background."

        const scene = timerScenes && timerScenes[index];
        if (!scene) return;
        const layers = scene.layers || [];

        // image-cycle bg still needs its own cycling/interval logic, which

    // elapsedMs counts up from 0 (segment start) — the countdown's own

    // clamped so overtime (remainingMs < 0) doesn't push it past totalMs
    // and off the end of the last scene.

    }

    // 'cut' (default) just swaps the background-image outright. 'slide'
    // animates a second frame sliding in left-to-right over the first.
    // 'crossfade' dissolves the new frame in over the old one instead of
    // a hard cut or a directional slide — closest achievable read on
    // PowerPoint's Morph transition for a RAPID stream of unrelated
    // photos (different people, no shared shape/object for Morph's own
    // object-matching trick to actually interpolate between): Morph's real
    // magic is tweening the SAME object's position/size/rotation across
    // two slides, which has nothing to key off between two different
    // faces, so the honest equivalent here is a fast, fluid dissolve
    // layered on top of one CONTINUOUS Ken Burns drift that never resets
    // between swaps (startCycleMotion runs once, on the wrapper's .cycle-art
    // child, and every swap below only ever changes ITS backgroundImage —
    // never restarts the animation) — the sequence reads as one ongoing
    // camera move panning across many faces, not a slideshow stopping and
    // starting on each one.
    // Both animated transitions clip to the layer's own box via the
    // wrapper's own overflow:hidden (set at build time, above), not
    // whatever's next to it. `el` is the OUTER wrapper ([data-cycle-images]
    // etc. — the thing handleActionBadge queries every tick); the actual
    // background-image lives on its inner .cycle-art child instead (see the
    // image-cycle branch above).
    function swapCycleImage(el, newSrc, transition) {
        const art = el.querySelector('.cycle-art') || el;
        if (transition === 'crossfade') {
            const fit = el.dataset.cycleFit || 'cover';
            const incoming = document.createElement('div');
            incoming.style.cssText = `position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:${fit === 'fill' ? '100% 100%' : fit};opacity:0;transition:opacity 420ms ease;`;
            incoming.style.backgroundImage = `url('${newSrc}')`;
            el.appendChild(incoming);
            requestAnimationFrame(() => { incoming.style.opacity = '1'; });
            setTimeout(() => {
                art.style.backgroundImage = `url('${newSrc}')`;
                incoming.remove();
            }, 440);
            return;
        }
        if (transition !== 'slide') { art.style.backgroundImage = `url('${newSrc}')`; return; }
        const fit = el.dataset.cycleFit || 'cover';
        const incoming = document.createElement('div');
        incoming.style.cssText = `position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:${fit === 'fill' ? '100% 100%' : fit};transform:translateX(100%);transition:transform 500ms ease;`;
        incoming.style.backgroundImage = `url('${newSrc}')`;
        el.appendChild(incoming);
        requestAnimationFrame(() => { incoming.style.transform = 'translateX(0)'; });
        setTimeout(() => {
            art.style.backgroundImage = `url('${newSrc}')`;
            incoming.remove();
        }, 520);
    }

    // A continuous slow drift/zoom on the image itself — "borrowed" as a
    // component idea (Remotion/HyperFrames-style motion primitives) but
    // reimplemented as a plain CSS animation rather than anything
    // frame-rendered, since this has to keep running live and in sync
    // with a countdown that can be re-timed at any moment, not play back
    // a fixed pre-rendered timeline. Deliberately decoupled from exact
    // per-image swap timing (a fixed loop length instead of matching
    // whichever spacing mode — interval vs whole-countdown — this layer
    // happens to use) — simpler, and restarting the animation on every
    // swap would just look like an abrupt snap back to scale 1 rather
    // than a continuous drift.
    function startCycleMotion(wrapper, art) {
        if (wrapper.dataset.cycleMotion !== 'kenburns') return;
        art.style.animation = 'kairo-kenburns 18s ease-in-out infinite alternate';
    }

    // ── Image slide: full-frame picture, bypassing the theme's text layers ──
    // Still honours the theme's canvas transparency, so an image slide over a
    // chroma/alpha rig keys the same way a verse slide would. This is a
    // slide-type item's own image (part of the slide layer) — not the
    // independent media layer; see renderMediaStage for that.
    function renderImageStage(src, animate = true, fit = 'contain') {
        currentImageSlide = { src, fit };
        if (outputMode === 'text') { slideLayer.innerHTML = ''; return; }   // a picture has no words
        const look = activeLook || FALLBACK_LOOK;
        const bg = (look.layers || []).find(l => l.type === 'background' && !l.pos);
        const isTransparent = !!(bg && bg.fill === 'transparent');

        const doRender = () => {
            slideLayer.innerHTML = '';
            document.body.classList.toggle('transparent-bg', isTransparent);
            const img = document.createElement('img');
            img.src = src;
            // object-fit accepts the literal 'fill' keyword natively — unlike
            // background-size (used elsewhere for layer.fit), no translation
            // to '100% 100%' is needed here.
            img.style.cssText = `position:absolute;inset:0;width:100%;height:100%;object-fit:${fit};`;
            slideLayer.appendChild(img);
        };

        if (animate) {
            slideLayer.style.transition = 'opacity 300ms ease';
            slideLayer.style.opacity    = '0';
            setTimeout(() => {
                doRender();
                slideLayer.style.opacity = '1';
            }, 320);
        } else {
            doRender();
        }
    }

    // ── Independent media layer: image or looping video, sent/cleared apart
    // from whatever the slide layer is showing. No native <video> controls —
    // this is the output the congregation sees; every control lives in the
    // operator's window and reaches here via WS (see handleMessage below).
    // What the operator sends or clears on the media layer comes in and goes out with
    // the output's Transition (Fade / Slide / Cut, and its length), like the slide layer.
    // Media a theme draws as its own background is swapped with renderMediaStage directly.
    let mediaGen = 0;
    // Media's own transition (the Media Bin's), else the words'.
    function mediaAnimation() {
        try { const m = JSON.parse(localStorage.getItem('kairo-media-transition') || 'null'); if (m && ['fade', 'slide-up', 'cut'].includes(m.animation)) return m.animation; } catch {}
        return outputAnimation;
    }
    function transitionMedia(src, kind, fit, motion) {
        const gen = ++mediaGen;
        const animType = mediaAnimation();
        const ms = Math.round(300 * outputAnimationSpeed);
        const reset = () => { mediaLayer.style.transition = 'none'; mediaLayer.style.opacity = '1'; mediaLayer.style.transform = 'none'; };
        if (animType === 'cut' || MONITOR) { reset(); renderMediaStage(src, kind, fit, motion); return; }
        const ease = `opacity ${ms}ms ease, transform ${ms}ms ease`;
        const comeIn = () => {
